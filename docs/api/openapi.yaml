openapi: 3.1.0
info:
  title: Rianell Health API
  version: "1"
  description: Versioned REST API for Rianell health logs and metrics.
servers:
  - url: https://{project}.supabase.co/functions/v1/api-v1
    variables:
      project:
        default: your-project-ref
security:
  - BearerAuth: []
components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT or API key
  schemas:
    ApiResponse:
      type: object
      properties:
        data: {}
        meta:
          type: object
          properties:
            total: { type: integer }
            page: { type: integer }
            per_page: { type: integer }
            version: { type: string }
        version: { type: string }
    ApiError:
      type: object
      properties:
        error:
          type: object
          properties:
            code: { type: string }
            message: { type: string }
        version: { type: string }
    LogEntry:
      type: object
      properties:
        date: { type: string, format: date }
        mood: { type: number }
        fatigue: { type: number }
        pain: { type: number }
paths:
  /me:
    get:
      summary: Current user profile
      responses:
        "200":
          description: Profile
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiResponse"
              example:
                data: { id: "00000000-0000-0000-0000-000000000001" }
                meta: { version: "1" }
                version: "1"
  /logs:
    get:
      summary: List health logs
      parameters:
        - name: since
          in: query
          schema: { type: string, format: date }
        - name: page
          in: query
          schema: { type: integer, default: 1 }
      responses:
        "200":
          description: Log list
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiResponse"
    post:
      summary: Create log entry
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LogEntry"
      responses:
        "200":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiResponse"
  /logs/{date}:
    get:
      summary: Log by date
      parameters:
        - name: date
          in: path
          required: true
          schema: { type: string, format: date }
      responses:
        "200":
          description: Single log
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiResponse"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
  /metrics:
    get:
      summary: Metric summary
      responses:
        "200":
          description: Metrics
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiResponse"
  /goals:
    get:
      summary: User goals
      responses:
        "200":
          description: Goals
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiResponse"
