            </div>
          </section>
          <section class="wizard-panel" data-step="polish" data-open="${active === 'polish' ? '1' : '0'}">
            <header><h3>5 · Polish×8</h3><p>Up to 8 Q&A re-polish rounds on approved ids. C column only.</p></header>
            ${polishBody}
            <div class="wizard-nav">
              <button type="button" class="btn" data-wiz-prev="approve">${icon('rtl')} Approve</button>
              ${hopHtml}
            </div>
          </section>
        </div>`;
      }

      if (wizard) {
        const active = opts.focusStep || (wizardFollow ? deriveWizardStep(act, pack) : wizardStep) || 'gates';
        const research = act?.research;
        const gateBody = done.length
          ? `<div class="body done-chips">${done.map((d) => `<span class="chip">${escapeHtml(d.label)} · ${escapeHtml(d.status)}</span>`).join('')}</div>`
          : wizardEmpty('Gates not started', 'Run Dry-run or Live - verify scripts run before the research + LLM advisory.');
        const researchBody = research?.text
          ? `<div class="chip" style="margin-bottom:0.5rem">${research.configured ? 'Firecrawl configured' : 'offline stub'} · ${research.sources || 0} source(s)</div>
             <div class="body md">${renderMd(research.text)}</div>`
          : wizardEmpty('Research not started', 'After gates pass, Firecrawl builds a pack-scoped web brief so the LLM can ground Approvals. Set FIRECRAWL_API_KEY in Settings.');
        const thinkBody = thinkText
          ? `${ctxChip}<div class="body md" id="thinkingBody">${renderMd(thinkText)}${thinking.streaming ? ' <span class="cursor-blink"></span>' : ''}</div>`
          : wizardEmpty('Waiting on LLM', 'After Research, Thinking streams here. Model unload stays grouped with sibling packs.');
        const planListReview = items.length ? `
          <div class="body plan-list" style="white-space:normal">
            ${items.map((it) => `
              <div class="plan-item" style="cursor:default">
                <span>
                  <strong>${escapeHtml(it.title)}</strong>
                  <div style="color:var(--muted);font-size:0.75rem">${escapeHtml((it.detail || '').slice(0, 180))}</div>
                </span>
                <span class="risk-${escapeHtml(it.risk || 'low')}">${escapeHtml(it.risk || 'low')}</span>
              </div>`).join('')}
          </div>` : wizardEmpty('No proposal yet', 'Proposal items appear after the advisory (or TranslateGemma fill) finishes.');
        const planListApprove = items.length ? `
          <div class="body plan-list" style="white-space:normal" id="plannedBody">
            ${items.map((it) => `
              <label class="plan-item">
                <input type="checkbox" data-item="${escapeHtml(it.id)}" ${it.selected !== false ? 'checked' : ''}
                  ${(it.fillStatus === 'pending' || it.proposed == null) && it.kind === 'i18n_string' ? 'disabled' : ''} />
                <span>
                  <strong>${escapeHtml(it.title)}</strong>
                  <div style="color:var(--muted);font-size:0.75rem">${escapeHtml((it.detail || '').slice(0, 180))}</div>
                </span>
                <span class="risk-${escapeHtml(it.risk || 'low')}">${escapeHtml(
                  it.fillStatus === 'pending' ? 'missing'
                    : (it.fillStatus === 'failed' ? 'failed' : (it.risk || 'low'))
                )}</span>
              </label>`).join('')}
          </div>` : wizardEmpty('Nothing to approve', 'Finish Live so Planned items land in this queue.');
        const approveActions = hidePlanned
          ? ''
          : `
            <div class="activity-actions">
              <label class="chip"><input type="checkbox" id="optConfirmWrite" /> confirm product write</label>
              <label class="chip"><input type="checkbox" id="optAllowBump" /> allow dep bump</label>
              <label class="chip"><input type="checkbox" id="optGitCommit" /> git commit+push</label>
              <button class="btn primary" id="btnApprove">${icon('check')} Approve selected</button>
              <button class="btn" id="btnReject">${icon('x')} Reject</button>
            </div>`;
        const approveList = hidePlanned
          ? wizardEmpty('Hidden', 'Proposal hidden for this pack.')
          : planListApprove;

        return `
        <div class="activity wizard" id="activityRoot" data-wizard-step="${active}"${hidePlanned ? ' data-no-planned="1"' : ''}>
          <div class="wizard-meta">
            <span class="chip">Status <strong>${escapeHtml(now.status || 'idle')}</strong></span>
            <span class="chip">Stage <strong>${escapeHtml(now.stage || '-')}</strong></span>
            <span class="chip">Model <strong>${escapeHtml(now.model || 'none')}</strong></span>
            ${now.needsApproval && !hidePlanned ? '<span class="chip warn-chip">needs approval</span>' : ''}
            ${now.dryRun ? '<span class="chip">dry-run</span>' : ''}
          </div>
          <section class="wizard-panel" data-step="gates" data-open="${active === 'gates' ? '1' : '0'}">
            <header><h3>1 · Gates</h3><p>Hard verifies before research or LLM spend.</p></header>
            ${gateBody}
            <div class="wizard-nav">
              <button type="button" class="btn" data-wiz-next="research">Next · Research ${icon('run-all')}</button>
              ${hopHtml}
            </div>
          </section>
          <section class="wizard-panel" data-step="research" data-open="${active === 'research' ? '1' : '0'}">
            <header><h3>2 · Research</h3><p>Firecrawl brief for this pack - feeds the LLM before Approvals.</p></header>
            ${researchBody}
            <div class="wizard-nav">
              <button type="button" class="btn" data-wiz-prev="gates">${icon('rtl')} Gates</button>
              <button type="button" class="btn" data-wiz-next="llm">Next · LLM ${icon('run-all')}</button>
            </div>
          </section>
          <section class="wizard-panel" data-step="llm" data-open="${active === 'llm' ? '1' : '0'}">
            <header><h3>3 · LLM ${thinking.streaming ? '<span class="cursor-blink"></span>' : ''}</h3><p>Thinking stream / fill progress for this pack.</p></header>
            ${thinkBody}
            <div class="wizard-nav">
              <button type="button" class="btn" data-wiz-prev="research">${icon('rtl')} Research</button>
              <button type="button" class="btn" data-wiz-next="proposal">Next · Proposal ${icon('run-all')}</button>
            </div>
          </section>
          <section class="wizard-panel" data-step="proposal" data-open="${active === 'proposal' ? '1' : '0'}">
            <header><h3>4 · Proposal</h3><p>${escapeHtml(planned.summary || 'Review generated actions before Approve.')}</p></header>
            ${planListReview}
            <div class="wizard-nav">
              <button type="button" class="btn" data-wiz-prev="llm">${icon('rtl')} LLM</button>
              <button type="button" class="btn primary" data-wiz-next="approve">Next · Approve</button>
            </div>
          </section>
          <section class="wizard-panel" data-step="approve" data-open="${active === 'approve' ? '1' : '0'}">
            <header><h3>5 · Approve</h3><p>Approve enqueues apply work (model-grouped drain). Product writes need confirm.</p></header>
            ${approveList}
            <div class="wizard-footer">
              ${approveActions}
              <div class="wizard-nav">
                <button type="button" class="btn" data-wiz-prev="proposal">${icon('rtl')} Proposal</button>
                ${hopHtml}
              </div>
            </div>
          </section>
        </div>`;
      }

      const plannedPanel = hidePlanned ? '' : `
          <div class="activity-panel ap-plan">
            <h3>Planned · ${escapeHtml(planned.summary || '')}</h3>
            <div class="body" style="white-space:normal;max-height:280px" id="plannedBody">
              ${items.length ? items.map((it) => `
                <label class="plan-item">
                  <input type="checkbox" data-item="${escapeHtml(it.id)}" ${it.selected !== false ? 'checked' : ''}
                    ${(it.fillStatus === 'pending' || it.proposed == null) && it.kind === 'i18n_string' ? 'disabled' : ''} />
                  <span>
                    <strong>${escapeHtml(it.title)}</strong>
                    <div style="color:var(--muted);font-size:0.75rem">${escapeHtml((it.detail || '').slice(0, 180))}</div>
                  </span>
                  <span class="risk-${escapeHtml(it.risk || 'low')}">${escapeHtml(
                    it.fillStatus === 'pending' ? 'missing'
                      : (it.fillStatus === 'failed' ? 'failed' : (it.risk || 'low'))
                  )}</span>
                </label>`).join('') : '<div class="chip">No proposal items yet - run Dry-run or Live</div>'}
            </div>
            <div class="activity-actions">
              <label class="chip"><input type="checkbox" id="optConfirmWrite" /> confirm product write</label>
              <label class="chip"><input type="checkbox" id="optAllowBump" /> allow dep bump</label>
              <label class="chip"><input type="checkbox" id="optGitCommit" /> git commit+push</label>
              <button class="btn primary" id="btnApprove">${icon('check')} Approve selected</button>
              <button class="btn" id="btnReject">${icon('x')} Reject</button>
            </div>
          </div>`;

      const nowBody = cockpit
        ? `<div class="body now-metrics">
            <div class="metric"><span>Status</span><strong>${escapeHtml(now.status || 'idle')}</strong></div>
            <div class="metric"><span>Stage</span><strong>${escapeHtml(now.stage || '-')}</strong></div>
            <div class="metric"><span>Model</span><strong>${escapeHtml(now.model || 'none')}</strong></div>
            ${now.needsApproval && !hidePlanned ? '<div class="metric"><span>Gate</span><strong style="color:var(--warn)">needs approval</strong></div>' : ''}
            ${now.dryRun ? '<div class="metric"><span>Mode</span><strong>dry-run</strong></div>' : ''}
          </div>`
        : `<div class="body">
              Status <strong>${escapeHtml(now.status || 'idle')}</strong>
              · stage ${escapeHtml(now.stage || '-')}
              · ${escapeHtml(now.model || 'no model')}
              ${now.needsApproval && !hidePlanned ? '<br><span class="chip warn-chip">needs approval</span>' : ''}
            </div>`;

      const doneBody = cockpit
        ? `<div class="body done-chips">${done.length
          ? done.map((d) => `<span class="chip">${escapeHtml(d.label)} · ${escapeHtml(d.status)}</span>`).join('')
          : '<span class="chip">No gates finished yet</span>'}</div>`
        : `<div class="body">${done.length
          ? done.map((d) => `• ${escapeHtml(d.label)} · ${escapeHtml(d.status)}`).join('\n')
          : '-'}</div>`;

      return `
        <div class="activity${cockpit ? ' cockpit' : ''}" id="activityRoot"${hidePlanned ? ' data-no-planned="1"' : ''}>
          <div class="activity-panel ap-now">
            <h3>Now</h3>
            ${nowBody}
          </div>
          <div class="activity-panel ap-think">
            <h3>Thinking ${thinking.streaming ? '<span class="cursor-blink"></span>' : ''}</h3>
            ${ctxChip}
            <div class="body md" id="thinkingBody">${renderMd(thinkText || '-')}</div>
          </div>
          <div class="activity-panel ap-done">
            <h3>Done</h3>
            ${doneBody}
          </div>
          ${plannedPanel}
        </div>`;
    }

    function wireWizardNav(pack) {
      document.querySelectorAll('[data-wiz-next]').forEach((btn) => {
        btn.onclick = () => focusWizardStep(btn.dataset.wizNext, { pin: true, pack });
      });
      document.querySelectorAll('[data-wiz-prev]').forEach((btn) => {
        btn.onclick = () => focusWizardStep(btn.dataset.wizPrev, { pin: true, pack });
      });
      document.querySelectorAll('[data-pack-hop]').forEach((btn) => {
        btn.onclick = () => {
          state.view = btn.dataset.packHop;
          wizardFollow = true;
          wizardStep = 'gates';
          render();
        };
      });
      wirePipeRail(pack);
    }

    function packInsight(pack) {
      if (pack === 'i18n') return 'TranslateGemma propose-dir → Approve (+ confirm) → merge Tier-C';
      if (pack === 'deps') return 'Bumps require allowDependencyBump + confirm - never silent';
      if (pack === 'security') return 'Ack only - CSP/header edits refused';
      if (pack === 'visual') return 'Gates → Q&A candidates → Approve → Polish×8 (C only)';
      if (pack === 'changelog') return 'Draft bullets from git + Unreleased · promote on Approve';
      return 'Review Thinking + Planned · Approve before product writes';
    }

    function selectedItemIds() {
      return [...document.querySelectorAll('#plannedBody input[data-item]:checked')]
        .map((el) => el.dataset.item);
    }

    async function wireActivityActions(pack) {
      const approve = document.getElementById('btnApprove');
      const reject = document.getElementById('btnReject');
      if (!approve || !reject) return;
      approve.onclick = async () => {
        try {
          const data = await client.approvePack(pack, {
            itemIds: selectedItemIds(),
            confirmProductWrite: document.getElementById('optConfirmWrite')?.checked,
            allowDependencyBump: document.getElementById('optAllowBump')?.checked,
            gitCommitOnApprove: document.getElementById('optGitCommit')?.checked,
          });
          log(data);
          await render();
        } catch (e) { log(e.envelope || e.message); }
      };
      reject.onclick = async () => {
        try {
          log(await client.rejectPack(pack, {}));
          await render();
        } catch (e) { log(e.envelope || e.message); }
      };
    }

    let activityPoll = null;
    let activityPollPack = null;
    let lastActivityStructFp = '';
    let lastThinkingFp = '';
    let lastRailFp = '';
    let lastPillFp = '';

    function stopActivityPoll() {
      if (activityPoll) { clearInterval(activityPoll); activityPoll = null; }
      activityPollPack = null;
    }

    function activityStructFingerprint(act) {
      if (!act) return '';
      const items = (act.planned?.items || [])
        .map((i) => `${i.id}:${i.selected !== false}:${i.fillStatus || ''}:${i.title}:${String(i.proposed || '').slice(0, 24)}`)
        .join('|');
      const done = (act.done || []).map((d) => `${d.label}:${d.status}`).join('|');
      const n = act.now || {};
      const fill = act.thinking?.fillProgress;
      return [
        act.pack, n.status, n.stage, n.model, n.needsApproval, n.dryRun,
        act.planned?.status, act.planned?.summary, done, items,
        act.thinking?.context?.filesUsed?.length || 0,
        fill ? `${fill.locale}:${fill.done}/${fill.total}:${fill.phase}` : '',
      ].join('::');
    }

    function railFingerprint(act) {
      const n = act?.now || {};
      const doneN = (act?.done || []).length;
      const planN = (act?.planned?.items || []).length;
      return `${n.status}|${n.stage}|${n.model}|${doneN}|${planN}|${n.needsApproval}`;
    }

    /** Patch pack Activity / rail without rebuilding the whole tab (keeps iframe + controls stable). */
    async function softRefreshPackActivity(pack, { force = false } = {}) {
      const act = await client.getPackActivity(pack).catch(() => null);
      if (!act) return null;

      const host = document.getElementById('packActivity')
        || document.getElementById('runAllActivity');
      if (!host) {
        // Visual legacy: pill + rail only when activity host missing
        if (pack === 'visual') {
          const pill = document.querySelector('.pack-stage .pack-status-pill');
          if (pill && act.now?.status) {
            pill.dataset.s = act.now.status;
            pill.innerHTML = `${icon('dot')} ${escapeHtml(act.now.status)}`;
          }
          const rail = document.querySelector('.pack-stage .pipe-rail');
          if (rail) {
            const focus = wizardFollow ? deriveWizardStep(act, pack) : wizardStep;
            const tmp = document.createElement('div');
            tmp.innerHTML = pipeRailHtml(act, { pack, focusStep: focus });
            if (tmp.firstElementChild) rail.replaceWith(tmp.firstElementChild);
            wirePipeRail(pack);
          }
        }
        return act;
      }

      const railFp = railFingerprint(act);
      if (force || railFp !== lastRailFp) {
        lastRailFp = railFp;
        const rail = document.querySelector('.pack-stage .pipe-rail');
        if (rail) {
          const focus = (host.id === 'packActivity' && !wizardFollow)
            ? wizardStep
            : deriveWizardStep(act, pack);
          if (host.id === 'packActivity' && wizardFollow) wizardStep = focus;
          const tmp = document.createElement('div');
          tmp.innerHTML = pipeRailHtml(act, { pack, focusStep: focus });
          if (tmp.firstElementChild) rail.replaceWith(tmp.firstElementChild);
          wirePipeRail(pack);
        }
      }

      const pillFp = `${act.now?.status || ''}`;
      if (force || pillFp !== lastPillFp) {
        lastPillFp = pillFp;
        const pill = document.querySelector('.pack-stage .pack-status-pill');
        if (pill && act.now?.status) {
          pill.dataset.s = act.now.status;
          pill.innerHTML = `${icon('dot')} ${escapeHtml(act.now.status)}`;
        }
      }

      const structFp = activityStructFingerprint(act);
      if (force || structFp !== lastActivityStructFp) {
        lastActivityStructFp = structFp;
        const isPackTab = host.id === 'packActivity';
        if (isPackTab && wizardFollow) wizardStep = deriveWizardStep(act, pack);
        host.innerHTML = activityHtml(act, {
          pack,
          layout: isPackTab ? 'wizard' : undefined,
          focusStep: isPackTab ? wizardStep : undefined,
        });
        await wireActivityActions(pack);
        if (isPackTab) wireWizardNav(pack);
        lastThinkingFp = '';
      }

      const stream = await client.getPackStream(pack).catch(() => null);
      const thinkEl = document.getElementById('thinkingBody');
      if (thinkEl) {
        const fill = stream?.fillProgress || act.thinking?.fillProgress;
        const text = fill
          ? `Filling ${fill.locale || '…'} · ${fill.done || 0}/${fill.total || 0}`
            + (fill.sampleTranslation ? `\n\n${fill.lastKey}: ${fill.sampleTranslation}` : '')
            + (act.thinking?.text ? `\n\n${act.thinking.text}` : '')
          : (stream?.text || act.thinking?.text || '-');
        const tFp = `${fill?.done || 0}/${fill?.total || 0}|${text.length}|${text.slice(-120)}`;
        if (tFp !== lastThinkingFp) {
          lastThinkingFp = tFp;
          thinkEl.innerHTML = renderMd(text);
        }
      }
      return act;
    }

    function startActivityPoll(pack) {
      if (activityPoll && activityPollPack === pack) return;
      stopActivityPoll();
      activityPollPack = pack;
      activityPoll = setInterval(async () => {
        if (activityPollPack !== pack) return;
        if (state.view !== pack && state.view !== 'run-all' && state.view !== 'overview') return;
        try {
          const act = await softRefreshPackActivity(pack);
          if (!act?.now) return;
          const st = act.now.status;
          // Stay live through Research → LLM → Proposal; only park on terminal outcomes.
          if (st === 'applied' || st === 'rejected'
            || st === 'passed' || st === 'broken' || st === 'dry_run') {
            await softRefreshPackActivity(pack, { force: true });
            stopActivityPoll();
            return;
          }
          if (st === 'pending_approval') {
            // One solid paint so Approve UI is complete, then slow via run-all poll.
            await softRefreshPackActivity(pack, { force: true });
            stopActivityPoll();
            ensureRunAllPoll();
          }
        } catch { /* quiet */ }
      }, 800);
      softRefreshPackActivity(pack).catch(() => {});
    }

    function progressPct(runState) {
      if (!runState) return 0;
      const total = (runState.order || PACKS).length || 16;
      const done = Object.keys(runState.results || {}).length;
      return Math.round((done / total) * 100);
    }

    function paintProgress(runState, order, pct) {
      const prog = document.getElementById('progress');
      if (!prog) return;
      const done = Object.keys(runState?.results || {}).length;
      const total = order.length;
      const cur = runState?.currentPack || '-';
      const mode = runState?.dryRun ? 'dry-run' : (runState ? 'live' : '-');
      const st = runState?.status || 'idle';
      const note = pollNote
        ? `<span class="chip warn-chip" style="margin-left:8px">${icon('x')} ${pollNote}</span>`
        : '';
      prog.innerHTML = `
        <div class="progress-top">
          <span>Status <strong>${st}</strong> · ${mode}${note}</span>
          <span><strong>${Math.min(done, total)}</strong> / ${total} · ${cur}</span>
        </div>
        <div class="bar"><i style="width:${pct}%"></i></div>`;
    }

    function paintTimeline(runState, { force = false } = {}) {
      lastRunState = runState;
      const tl = document.getElementById('tl');
      const ring = document.getElementById('ring');
      const order = (runState && runState.order && runState.order.length)
        ? runState.order
        : (catalog?.runAllOrder || PACKS);
      const pct = progressPct(runState);
      const fp = runStateFingerprint(runState) + '|' + pollNote;
      const changed = force || fp !== lastTimelineFp;
      if (!changed) return;
      lastTimelineFp = fp;

      paintProgress(runState, order, pct);

      if (tl) {
        const firstPaint = !tl.querySelector('.step');
        tl.innerHTML = order.map((p, i) => {
          const s = stepStatus(p, runState);
          const enter = firstPaint ? ' step-enter' : '';
          const delay = firstPaint ? ` style="animation-delay:${i * 18}ms"` : '';
          return `<div class="step${enter}" data-pack="${p}" data-s="${s}"${delay}>
            <span class="n">${i + 1}</span>
            <span class="meta">${icon(p)}<code>${p}</code></span>
            ${statusBadge(s)}
          </div>`;
        }).join('');
      }

      if (ring) {
        ring.style.setProperty('--pct', String(pct));
        const b = ring.querySelector('b');
        const sub = ring.querySelector('[data-sub]');
        if (b) b.textContent = `${pct}%`;
        if (sub) sub.textContent = runState?.status || 'idle';
      }

      document.querySelectorAll('nav button[data-v]').forEach((b) => {
        const id = b.dataset.v;
        if (PACKS.includes(id)) b.dataset.s = stepStatus(id, runState);
      });

      // Overview pack tiles (soft patch - no fade-up flash on every poll).
      if (document.getElementById('packGrid')) {
        paintOverviewGrid(runState, { soft: true });
      }
    }

    function setRunAllBusy(busy) {
      const el = document.getElementById('go') || document.getElementById('btnRunAll');
      if (el) el.disabled = busy;
    }

    async function refreshRunAllTimeline() {
      let runAct = null;
      try {
        const st = await client.getRunAllStatus();
        if (pollNote) {
          pollNote = '';
          runAllPollMs = 1500;
        }
        paintTimeline(st);
        /* avoid rewriting the drawer every tick - only when status changes */
        const fp = runStateFingerprint(st);
        if (fp !== refreshRunAllTimeline._loggedFp) {
          refreshRunAllTimeline._loggedFp = fp;
          log(st);
        }
        // Soft-patch current pack Activity on run-all (no full view rewrite).
        const focusPack = (PACKS.includes(state.view) && state.view)
          || st?.currentPack
          || null;
        if (focusPack && (document.getElementById('runAllActivity') || document.getElementById('packActivity'))) {
          await softRefreshPackActivity(focusPack);
        } else if (st?.currentPack && document.getElementById('runAllActivity')) {
          await softRefreshPackActivity(st.currentPack);
        }
        // Overview: keep approval + apply queues in sync while polling.
        if (state.view === 'overview' || state.view === 'run-all') {
          try {
            runAct = await client.getRunAllActivity();
            if (state.view === 'overview') {
              softPaintApprovalQueue(runAct?.approvalQueue || []);
              softPaintApplyQueue(runAct?.applyQueue);
            }
            // Run-all: refresh approval hop buttons when the queue changes.
            if (state.view === 'run-all') {
              softPaintRunAllApprovalRow(runAct?.approvalQueue || []);
            }
          } catch { /* quiet */ }
        }
        const keep = shouldKeepUiPolling(st, runAct);
        setRunAllBusy(st?.status === 'running' || st?.status === 'paused');
        if (!keep) stopRunAllPoll();
        return keep;
      } catch (e) {
        const code = e.code || e.envelope?.error?.code;
        const msg = e.message || 'poll failed';
        if (code === 429 || /rate limited/i.test(msg)) {
          pollNote = 'polling backed off · rate limited';
          runAllPollMs = Math.min(12000, Math.max(5000, runAllPollMs * 2));
          ensureRunAllPoll();
          paintTimeline(lastRunState, { force: true });
        } else {
          pollNote = msg;
          paintTimeline(lastRunState, { force: true });
          log(e.envelope || msg);
        }
        return shouldKeepUiPolling(lastRunState, null);
      }
    }

    function ensureRunAllPoll() {
      if (runAllPoll) return;
      runAllPollMs = Math.min(runAllPollMs || 1500, 2500);
      runAllPoll = setInterval(() => { refreshRunAllTimeline(); }, runAllPollMs);
      // Immediate tick so Gates → Research → LLM advances without waiting for interval.
      refreshRunAllTimeline().catch(() => {});
    }

    function startRunAllPoll() {
      stopRunAllPoll();
      runAllPollMs = 1500;
      ensureRunAllPoll();
    }

    function softPaintApplyQueue(applyQueue) {
      const host = document.getElementById('view');
      if (!host || state.view !== 'overview') return;
      let el = document.getElementById('overviewApplyQueue');
      const pending = applyQueue?.pending || 0;
      const fp = `${pending}|${(applyQueue?.jobs || []).map((j) => j.packId).join(',')}`;
      if (fp === softPaintApplyQueue._fp) return;
      softPaintApplyQueue._fp = fp;
      if (!pending) {
        if (el) el.remove();
        return;
      }
      const html = `<div class="approval-queue" id="overviewApplyQueue"><strong>Apply queue (${pending})</strong> · model-grouped drain · ${
        (applyQueue.jobs || []).map((j) => escapeHtml(j.packId)).join(', ')
      }</div>`;
      if (el) {
        el.outerHTML = html;
      } else {
        const grid = document.getElementById('packGrid');
        if (grid) grid.insertAdjacentHTML('beforebegin', html);
      }
    }

    function softPaintRunAllApprovalRow(queue) {
      const host = document.getElementById('view');
      if (!host || state.view !== 'run-all') return;
      const fp = (queue || []).map((q) => q.pack).join(',');
      if (fp === softPaintRunAllApprovalRow._fp) return;
      softPaintRunAllApprovalRow._fp = fp;
      let row = document.getElementById('runAllApprovalRow');
      if (!queue.length) {
        if (row) row.remove();
        return;
      }
      const html = `<div class="approval-queue" id="runAllApprovalRow"><strong>Needs approval</strong> · ${
        queue.map((q) => `<button class="btn" data-goto="${escapeHtml(q.pack)}">${escapeHtml(q.pack)}</button>`).join(' ')
      }</div>`;
      if (row) row.outerHTML = html;
      else {
        const prog = document.getElementById('progress');
        if (prog) prog.insertAdjacentHTML('afterend', html);
      }
      document.querySelectorAll('#runAllApprovalRow [data-goto]').forEach((b) => {
        b.onclick = () => { state.view = b.dataset.goto; render(); };
      });
    }

    function renderNav() {
      const nav = document.getElementById('nav');
      let html = `<div class="brand">
        <div class="brand-mark">${icon('run-all')}</div>
        <div><strong>Rianell</strong><span>Agentic harness</span></div>
      </div>`;
      let group = '';
      for (const item of NAV) {
        if (item.group !== group) {
          group = item.group;
          html += `<div class="nav-sec">${group}</div>`;
        }
        const s = PACKS.includes(item.id) ? stepStatus(item.id, lastRunState) : '';
        html += `<button data-v="${item.id}" data-s="${s}" class="${state.view === item.id ? 'active' : ''}">
          ${icon(item.id)}
          <span>${item.id}</span>
          ${PACKS.includes(item.id) ? '<span class="dot"></span>' : ''}
        </button>`;
      }
      nav.innerHTML = html;
      nav.querySelectorAll('button').forEach((b) => {
        b.onclick = () => {
          const v = b.dataset.v === 'models' ? 'settings' : b.dataset.v;
          state.view = v;
          render();
        };
      });
    }

    async function refreshHud({ force = false } = {}) {
      const hud = document.getElementById('hud');
      const now = Date.now();
      if (!force && lastHudOk && now - lastHudAt < 15000) {
        if (pollNote) {
          hud.innerHTML = lastHudOk +
            `<span class="chip warn-chip">${icon('x')} ${pollNote}</span>`;
        } else {
          hud.innerHTML = lastHudOk;
        }
        return;
      }
      try {
        const [health, gpus] = await Promise.all([
          client.getHealth(),
          client.getGpus().catch(() => null),
        ]);
        const profile = gpus?.effectiveProfile || gpus?.profile || 'unknown';
        const profileLabel = gpus?.override && gpus.override !== 'auto'
          ? `${profile}*`
          : profile;
        // localhost / 127.* / ::1 (page + API peer) → safe client
        const safe = client.safeClient === true && health.safeClient !== false;
        const safeChip = safe
          ? `<span class="chip">${icon('check')}<strong>safe client</strong> · localhost</span>`
          : `<span class="chip bad-chip">${icon('security')} unsafe host</span>`;
        lastHudOk =
          `<span class="chip">${icon('check')}<strong>API</strong> ok</span>` +
          `<span class="chip">${icon('overview')} packs <strong>${(health.packs || PACKS).length}</strong></span>` +
          `<span class="chip">${icon('models')} <strong>${profileLabel}</strong></span>` +
          safeChip;
        lastHudAt = now;
        hud.innerHTML = lastHudOk + (pollNote
          ? `<span class="chip warn-chip">${icon('x')} ${pollNote}</span>`
          : '');
      } catch (e) {
        const msg = e.message || 'API error';
        if (lastHudOk && (e.code === 429 || /rate limited/i.test(msg))) {
          hud.innerHTML = lastHudOk +
            `<span class="chip warn-chip">${icon('x')} rate limited · retrying calmly</span>`;
          return;
        }
        hud.innerHTML =
          `<span class="chip bad-chip">${icon('x')} ${msg}</span>`;
      }
    }

    function packRecommended(id) {
      return catalog?.packs?.[id]?.recommended || '-';
    }

    function paintOverviewGrid(runState, { soft = false } = {}) {
      const grid = document.getElementById('packGrid');
      if (!grid) return;
      const tiles = grid.querySelectorAll('.pack-tile');
      if (soft && tiles.length === PACKS.length) {
        PACKS.forEach((p) => {
          const el = grid.querySelector(`.pack-tile[data-pack="${p}"]`);
          if (!el) return;
          const s = stepStatus(p, runState);
          if (el.dataset.s === s) return;
          el.dataset.s = s;
          const row = el.querySelector('.status-row');
          if (row) row.innerHTML = `<strong>${p}</strong>${statusBadge(s)}`;
        });
        return;
      }
      grid.innerHTML = PACKS.map((p, i) => {
        const s = stepStatus(p, runState);
        return `<button class="pack-tile" data-s="${s}" data-pack="${p}" style="animation-delay:${i * 20}ms">
          <div class="ico">${icon(p)}</div>
          <div class="status-row"><strong>${p}</strong>${statusBadge(s)}</div>
          <small>${packRecommended(p)}</small>
        </button>`;
      }).join('');
      grid.querySelectorAll('.pack-tile').forEach((el) => {
        el.onclick = () => { state.view = el.dataset.pack; render(); };
      });
    }

    function softPaintApprovalQueue(queue) {
      const host = document.getElementById('view');
      if (!host || state.view !== 'overview') return;
      const fp = (queue || []).map((q) => q.pack).join(',');
      if (fp === softPaintApprovalQueue._fp) return;
      softPaintApprovalQueue._fp = fp;
      let el = document.getElementById('overviewApprovalQueue');
      if (!(queue || []).length) {
        if (el) el.remove();
        return;
      }
      const html = `<div class="approval-queue" id="overviewApprovalQueue"><strong>Approval queue (${queue.length})</strong> · ${
        queue.map((q) => escapeHtml(q.pack)).join(', ')
      }</div>`;
      if (el) el.outerHTML = html;
      else {
        const grid = document.getElementById('packGrid');
        const apply = document.getElementById('overviewApplyQueue');
        if (apply) apply.insertAdjacentHTML('beforebegin', html);
        else if (grid) grid.insertAdjacentHTML('beforebegin', html);
      }
    }

    async function render() {

      await refreshHud();
      // Collapse debug on view change; stay collapsed by default (log never auto-opens).

      }

        stopActivityPoll();
        softPaintApprovalQueue._fp = undefined;
        const pct = progressPct(lastRunState);
        let runAct = null;
        try { runAct = await client.getRunAllActivity(); } catch { /* */ }

        softPaintApprovalQueue._fp = (queue || []).map((q) => q.pack).join(',');
        view.innerHTML = `

          <div id="runAllActivity">${activityHtml(runAct?.currentActivity)}</div>
          <div class="timeline" id="tl"></div>`;
        paintTimeline(lastRunState);
        softPaintRunAllApprovalRow._fp = (queue || []).map((q) => q.pack).join(',');
        startRunAllPoll();
        document.querySelectorAll('[data-goto]').forEach((b) => {
          b.onclick = () => { state.view = b.dataset.goto; render(); };
        });
        if (runAct?.currentActivity?.pack) {
          wireActivityActions(runAct.currentActivity.pack);
        }
        document.getElementById('go').onclick = async () => {
          const prefs = await client.getMode().catch(() => ({}));
          const ok = await uiConfirm({
            title: 'Run all packs live?',
            message: `Runs all 16 packs without waiting for Approve (model-grouped unload). autoApprove=${prefs.autoApprove || false} (${prefs.autoApproveMode || 'ack'}). Afterward, review the approval queue - Approve enqueues apply work by model group. Product writes stay off unless you enabled product-write + confirm in Settings.`,
            okLabel: 'Run all',
            cancelLabel: 'Cancel',
            iconName: 'play',
          });
          if (!ok) return;
          setRunAllBusy(true);
          try {
            const result = await client.runAll({
              dryRun: false,
              background: true,
              stopOnBroken: false,
              autoApprove: Boolean(prefs.autoApprove),
              autoApproveMode: prefs.autoApproveMode || 'ack',
              confirmProductWrite: Boolean(prefs.confirmProductWrite),
              allowDependencyBump: Boolean(prefs.allowDependencyBump),
              gitCommitOnApprove: Boolean(prefs.gitCommitOnApprove),
            });
            paintTimeline(result);
            log(result);
            startRunAllPoll();
            await refreshRunAllTimeline();
          } catch (e) {
            log(e.envelope || e.message);
            setRunAllBusy(false);
          }
        };
        document.getElementById('pause').onclick = async () => {
          try { log(await client.pauseRunAll()); await refreshRunAllTimeline(); }
          catch (e) { log(e.message); }
        };
        document.getElementById('resume').onclick = async () => {
          try {
            log(await client.resumeRunAll());
            startRunAllPoll();
            await refreshRunAllTimeline();
          } catch (e) { log(e.message); }
        };
        document.getElementById('cancel').onclick = async () => {
          try {
            log(await client.cancelRunAll());
            await refreshRunAllTimeline();
            stopRunAllPoll();
            setRunAllBusy(false);
          } catch (e) { log(e.message); }
        };
        document.getElementById('st').onclick = () => refreshRunAllTimeline();
        document.getElementById('clearAll').onclick = async () => {
          const ok = await uiConfirm({
            title: 'Clear all + unload?',
            message: 'Stops running work, clears packs & pending approvals, unloads Ollama from VRAM.',
            okLabel: 'Clear',
            cancelLabel: 'Cancel',
            iconName: 'x',
            danger: true,
          });
          if (!ok) return;
          try {
            stopRunAllPoll();
            stopActivityPoll();
            lastRunState = null;
            setRunAllBusy(false);
            try { await client.cancelRunAll(); } catch { /* best-effort */ }
            log(await client.clearAll());
            state.view = 'overview';
            await render();
          } catch (e) { log(e.envelope || e.message); }
        };
        return;
      }

      if (state.view === 'models') state.view = 'settings';

      if (state.view === 'settings') {
        stopActivityPoll();
        const mode = await client.getMode().catch(() => ({ mode: 'serial' }));
        view.innerHTML = `
          <div class="pack-head">
            <div class="ico">${icon('settings')}</div>
            <div><h2 style="margin:0">settings</h2>
            <p style="margin:4px 0 0;color:var(--muted);font-size:0.85rem">Hardware profile · scheduler · approval defaults (require approval before apply: ON)</p></div>
          </div>
          <div class="panel">
            <label>Concurrency mode</label>
            <select id="modeSel">
              <option value="serial">serial</option>
              <option value="parallel">parallel</option>
              <option value="dry-run">dry-run</option>
            </select>
            <label><input type="checkbox" id="autoApprove" ${mode.autoApprove ? 'checked' : ''}/> autoApprove run-all (no human per pack)</label>
            <label>autoApprove mode</label>
            <select id="autoApproveMode">
              <option value="ack">ack only (no product writes)</option>
              <option value="product-write">product-write (needs confirm)</option>
            </select>
            <label><input type="checkbox" id="confirmProductWrite" ${mode.confirmProductWrite ? 'checked' : ''}/> confirmProductWrite master</label>
            <label><input type="checkbox" id="allowDependencyBump" ${mode.allowDependencyBump ? 'checked' : ''}/> allowDependencyBump</label>
            <label><input type="checkbox" id="gitCommitOnApprove" ${mode.gitCommitOnApprove ? 'checked' : ''}/> gitCommitOnApprove (LLM message per item → commit each → push pack)</label>
            <label>i18n fill scope</label>
            <select id="i18nFillScope">
              <option value="full">full (all non-EN)</option>
              <option value="tier-c">tier-c (ga, ar, he)</option>
            </select>
            <hr style="border:none;border-top:1px solid var(--line);margin:16px 0"/>
            <h3 style="margin:0 0 8px;font-size:0.95rem">Hardware profile</h3>
            <p id="hwProfileHint" style="margin:0 0 8px;color:var(--muted);font-size:0.85rem">Loading…</p>
            <label>Profile (auto-detect or manual override)</label>
            <select id="hwProfileSel" style="max-width:28rem"></select>
            <hr style="border:none;border-top:1px solid var(--line);margin:16px 0"/>
            <h3 style="margin:0 0 8px;font-size:0.95rem">Firecrawl</h3>
            <p id="fcStatus" style="margin:0 0 8px;color:var(--muted);font-size:0.85rem">Checking…</p>
            <label>API key (security/.env · not committed)</label>
            <input type="password" id="fcKey" placeholder="fc-…" autocomplete="off" style="width:100%;max-width:28rem"/>
            <div class="actions" style="margin-top:10px">
              <button class="primary" id="fcSave" hidden>${icon('check')} Save key</button>
              <button id="fcClear">${icon('x')} Clear key</button>
            </div>
            <p class="warn" style="margin-top:10px">Approval log: artifacts/agentic/approval-log.jsonl · never auto-pushes git</p>
            <div class="actions" style="margin-top:14px">
              <button class="primary" id="saveMode" hidden>${icon('check')} Save prefs</button>
              <button id="pauseAll">${icon('pause')} Pause all</button>
              <button id="resumeAll">${icon('play')} Resume all</button>
            </div>
          </div>`;
        document.getElementById('modeSel').value = mode.mode || 'serial';
        document.getElementById('autoApproveMode').value = mode.autoApproveMode || 'ack';
        document.getElementById('i18nFillScope').value = mode.i18nFillScope || 'full';
        const readPrefsForm = () => ({
          mode: document.getElementById('modeSel')?.value || 'serial',
          autoApprove: Boolean(document.getElementById('autoApprove')?.checked),
          autoApproveMode: document.getElementById('autoApproveMode')?.value || 'ack',
          confirmProductWrite: Boolean(document.getElementById('confirmProductWrite')?.checked),
          allowDependencyBump: Boolean(document.getElementById('allowDependencyBump')?.checked),
          gitCommitOnApprove: Boolean(document.getElementById('gitCommitOnApprove')?.checked),
          i18nFillScope: document.getElementById('i18nFillScope')?.value || 'full',
          hardwareProfile: document.getElementById('hwProfileSel')?.value || 'auto',
        });
        let prefsBaseline = null;
        const syncSavePrefsVisibility = () => {
          const btn = document.getElementById('saveMode');
          if (!btn || !prefsBaseline) {
            if (btn) btn.hidden = true;
            return;
          }
          btn.hidden = JSON.stringify(readPrefsForm()) === JSON.stringify(prefsBaseline);
        };
        const capturePrefsBaseline = () => {
          prefsBaseline = readPrefsForm();
          syncSavePrefsVisibility();
        };
        capturePrefsBaseline();
        const hwSel = document.getElementById('hwProfileSel');
        const hwHint = document.getElementById('hwProfileHint');
        client.getGpus().then((g) => {
          const profiles = g?.profiles || [
            { id: 'auto', label: 'Auto-detect' },
            { id: 'cpu_only', label: 'CPU only' },
            { id: 'single_8', label: 'Single GPU · ~8 GB' },
            { id: 'single_12', label: 'Single GPU · ~12 GB' },
            { id: 'single_16', label: 'Single GPU · ~16 GB' },
            { id: 'single_24', label: 'Single GPU · ~24 GB' },
            { id: 'dual_12_16', label: 'Dual GPU · 12+16 GB' },
            { id: 'dual_balanced', label: 'Dual / multi GPU' },
            { id: 'workstation_48', label: 'Workstation · 40 GB+' },
          ];
          hwSel.innerHTML = profiles.map((p) =>
            `<option value="${escapeHtml(p.id)}">${escapeHtml(p.label || p.id)}</option>`).join('');
          const chosen = mode.hardwareProfile || 'auto';
          hwSel.value = profiles.some((p) => p.id === chosen) ? chosen : 'auto';
          const eff = g?.effectiveProfile || g?.profile || '-';
          const ovr = g?.override && g.override !== 'auto' ? `override · auto would be ${g.autoWouldBe || '-'}` : 'auto-detect';
          const budget = g?.maxModelVramGb != null ? ` · budget ≤${g.maxModelVramGb} GB` : '';
          const gpuN = (g?.gpus || []).length;
          hwHint.textContent = `Effective: ${eff} (${ovr})${budget} · probed ${gpuN} GPU(s)`;
          capturePrefsBaseline();
        }).catch(() => {
          hwSel.innerHTML = '<option value="auto">Auto-detect</option>';
          hwHint.textContent = 'Could not probe GPUs - defaulting to auto.';
          capturePrefsBaseline();
        });
        for (const id of [
          'modeSel', 'autoApprove', 'autoApproveMode', 'confirmProductWrite',
          'allowDependencyBump', 'gitCommitOnApprove', 'i18nFillScope', 'hwProfileSel',
        ]) {
          const el = document.getElementById(id);
          if (!el) continue;
          el.addEventListener('change', syncSavePrefsVisibility);
          el.addEventListener('input', syncSavePrefsVisibility);
        }
        const paintFc = (st) => {
          const el = document.getElementById('fcStatus');
          if (!el) return;
          if (!st || !st.configured) {
            el.textContent = 'Not configured - paste a key to enable Research.';
            return;
          }
          el.textContent = `Configured (${st.hint || '••••'}) · ${st.source || 'local'}`;
        };
        const syncFcSaveVisibility = () => {
          const btn = document.getElementById('fcSave');
          const input = document.getElementById('fcKey');
          if (!btn || !input) return;
          btn.hidden = !input.value.trim();
        };
        client.getFirecrawl().then(paintFc).catch(() => paintFc(null));
        document.getElementById('fcKey').addEventListener('input', syncFcSaveVisibility);
        document.getElementById('fcKey').addEventListener('change', syncFcSaveVisibility);
        syncFcSaveVisibility();
        document.getElementById('fcSave').onclick = async () => {
          try {
            const apiKey = document.getElementById('fcKey').value.trim();
            if (!apiKey) { log('Enter a Firecrawl key first'); return; }
            paintFc(await client.setFirecrawlKey(apiKey));
            document.getElementById('fcKey').value = '';
            syncFcSaveVisibility();
            log({ ok: true, firecrawl: 'saved' });
          } catch (e) { log(e.message); }
        };
        document.getElementById('fcClear').onclick = async () => {
          try {
            paintFc(await client.clearFirecrawlKey());
            document.getElementById('fcKey').value = '';
            syncFcSaveVisibility();
            log({ ok: true, firecrawl: 'cleared' });
          } catch (e) { log(e.message); }
        };
        document.getElementById('saveMode').onclick = async () => {
          try {
            const next = readPrefsForm();
            log(await client.setMode(next));
            prefsBaseline = next;
            syncSavePrefsVisibility();
            // Refresh profile chip context after override save
            client.getGpus().then((g) => {
              const hint = document.getElementById('hwProfileHint');
              if (!hint || !g) return;
              const eff = g.effectiveProfile || g.profile || '-';
              const ovr = g.override && g.override !== 'auto' ? `override · auto would be ${g.autoWouldBe || '-'}` : 'auto-detect';
              const budget = g.maxModelVramGb != null ? ` · budget ≤${g.maxModelVramGb} GB` : '';
              hint.textContent = `Effective: ${eff} (${ovr})${budget} · probed ${(g.gpus || []).length} GPU(s)`;
            }).catch(() => {});
          } catch (e) { log(e.message); }
        };
        document.getElementById('pauseAll').onclick = async () => {
          try { log(await client.pauseAll()); } catch (e) { log(e.message); }
        };
        document.getElementById('resumeAll').onclick = async () => {
          try { log(await client.resumeAll()); } catch (e) { log(e.message); }
        };
        log(catalog);
        return;
      }

      const pack = state.view;

      let activity = null;
      try { activity = await client.getPackActivity(pack); } catch { /* */ }

      // Visual pack: Gates → Research → Q&A → Approve → Polish×8 + C-only live iframe.
      if (pack === 'visual') {
        const qa = await client.getVisualQa().catch(() => ({ brokenCount: '?', applyAllowed: false }));
        const st = activity?.now?.status || 'idle';
        wizardFollow = true;
        wizardStep = deriveWizardStep(activity, 'visual');
        view.innerHTML = `
          <div class="pack-stage pack-stage-enter visual-shell">
            <div class="pack-stage-card">
              <div class="pack-stage-head">
                <div class="pack-stage-title">
                  <div class="ico">${icon('visual')}</div>
                  <div>
                    <h2>visual</h2>
                    <p class="meta">Q&A candidates=${escapeHtml(qa.brokenCount)} · C only · Polish×8 on Approve</p>
                    <p class="insight">${packInsight('visual')}</p>
                    <div class="pack-status-pill" data-s="${escapeHtml(st)}">${icon('dot')} ${escapeHtml(st)}</div>
                  </div>
                </div>
                <div class="pack-control-bar">
                  <div class="pack-actions" role="toolbar" aria-label="Visual pack controls">
                    <button type="button" class="primary" id="startDry">${icon('play')} Dry-run</button>
                    <button type="button" id="startLive">${icon('run-all')} Live pack</button>
                    <button type="button" id="pause">${icon('pause')} Pause</button>
                    <button type="button" id="resume">${icon('play')} Resume</button>
                    <button type="button" id="report">${icon('planning')} Debug report</button>
                  </div>
                </div>
              </div>
              ${pipeRailHtml(activity, { pack: 'visual', focusStep: wizardStep })}
              <div class="pack-stage-body" id="packActivity">${activityHtml(activity, { pack: 'visual', layout: 'wizard', focusStep: wizardStep })}</div>
            </div>
            <div id="visualLive" class="embed-frame" style="display:grid;place-items:center;color:var(--muted)">Loading C preview…</div>
          </div>`;
        await wireActivityActions(pack);
        wireWizardNav(pack);
        lastActivityStructFp = activityStructFingerprint(activity);
        lastRailFp = railFingerprint(activity);
        lastPillFp = activity?.now?.status || '';
        startActivityPoll(pack);
        ensureRunAllPoll();
        const wire = (id, fn) => { document.getElementById(id).onclick = fn; };
        wire('startDry', async () => {
          try {
            log(await client.startPack(pack, { dryRun: true }));
            wizardFollow = true;
            startActivityPoll(pack);
            ensureRunAllPoll();
            await softRefreshPackActivity(pack, { force: true });
          } catch (e) { log(e.envelope || e.message); }
        });
        wire('startLive', async () => {
          try {
            log(await client.startPack(pack, { dryRun: false }));
            wizardFollow = true;
            startActivityPoll(pack);
            ensureRunAllPoll();
            await softRefreshPackActivity(pack, { force: true });
          } catch (e) { log(e.envelope || e.message); }
        });
        wire('pause', async () => {
          try {
            log(await client.pausePack(pack));
            await softRefreshPackActivity(pack, { force: true });
          } catch (e) { log(e.message); }
        });
        wire('resume', async () => {
          try {
            log(await client.resumePack(pack));
            startActivityPoll(pack);
            await softRefreshPackActivity(pack, { force: true });
          } catch (e) { log(e.message); }
        });
        wire('report', async () => {
          try { log(await client.getPackReport(pack)); openDebugDrawer(); }
          catch (e) { log(e.message); }
        });
        const box = document.getElementById('visualLive');
        try {
          const live = await client.getVisualLive();
          if (live.reachable) {
            const url = String(live.liveUrl || '').includes('agentic=')
              ? live.liveUrl
              : `${live.liveUrl}${live.liveUrl.includes('?') ? '&' : '?'}agentic=1&cOnly=1`;
            box.outerHTML = `<iframe class="embed-frame" title="Visual live polish C" src="${url}"></iframe>`;
          } else {
            box.innerHTML = `<p class="warn">Live polish offline. Run <code>${live.hint}</code>.</p>`;
          }
        } catch (e) {
          box.innerHTML = `<p class="warn">${e.message}</p>`;
        }
        return;
      }

      const st = activity?.now?.status || 'idle';
      wizardFollow = true;
      wizardStep = deriveWizardStep(activity, pack);
      view.innerHTML = `
        <div class="pack-stage pack-stage-enter">
          <div class="pack-stage-card">
            <div class="pack-stage-head">
              <div class="pack-stage-title">
                <div class="ico">${icon(pack)}</div>
                <div>
                  <h2>${escapeHtml(pack)}</h2>
                  <p class="meta">${escapeHtml(packRecommended(pack))}</p>
                  <p class="insight">${escapeHtml(packInsight(pack))}</p>
                  <div class="pack-status-pill" data-s="${escapeHtml(st)}">${icon('dot')} ${escapeHtml(st)}</div>
                </div>
              </div>
              <div class="pack-control-bar">
                <div class="field">
                  <label for="model">Model</label>
                  <select id="model"></select>
                </div>
                <div class="pack-actions">
                  <button type="button" class="primary" id="startDry">${icon('play')} Dry-run</button>
                  <button type="button" id="startLive">${icon('run-all')} Live</button>
                  <button type="button" id="pause">${icon('pause')} Pause</button>
                  <button type="button" id="resume">${icon('play')} Resume</button>
                  <button type="button" id="report">${icon('planning')} Debug report</button>
                </div>
              </div>
            </div>
            ${pipeRailHtml(activity, { pack, focusStep: wizardStep })}
            <div class="pack-stage-body" id="packActivity">${activityHtml(activity, { pack, layout: 'wizard', focusStep: wizardStep })}</div>
          </div>
        </div>`;

      await wireActivityActions(pack);
      wireWizardNav(pack);
      lastActivityStructFp = activityStructFingerprint(activity);
      lastRailFp = railFingerprint(activity);
      lastPillFp = activity?.now?.status || '';
      startActivityPoll(pack);
      ensureRunAllPoll();
      const sel = document.getElementById('model');
      const allowed = catalog?.packs?.[pack]?.allowed || [packRecommended(pack)];
      const rec = packRecommended(pack);
      sel.innerHTML = allowed.map((m) =>
        `<option value="${m}" ${m === rec ? 'selected' : ''}>${m}${m === rec ? ' · recommended' : ''}</option>`
      ).join('');
      document.getElementById('startDry').onclick = async () => {
        try {
          log(await client.startPack(pack, { dryRun: true, model: sel.value }));
          wizardFollow = true;
          startActivityPoll(pack);
          ensureRunAllPoll();
          await softRefreshPackActivity(pack, { force: true });
        } catch (e) { log(e.envelope || e.message); }
      };
      document.getElementById('startLive').onclick = async () => {
        try {
          log(await client.startPack(pack, { dryRun: false, model: sel.value }));
          wizardFollow = true;
          startActivityPoll(pack);
          ensureRunAllPoll();
          await softRefreshPackActivity(pack, { force: true });
        } catch (e) { log(e.envelope || e.message); }
      };
      document.getElementById('pause').onclick = async () => {
        try {
          log(await client.pausePack(pack));
          await softRefreshPackActivity(pack, { force: true });
        } catch (e) { log(e.message); }
      };
      document.getElementById('resume').onclick = async () => {
        try {
          log(await client.resumePack(pack));
          startActivityPoll(pack);
          ensureRunAllPoll();
          await softRefreshPackActivity(pack, { force: true });
        } catch (e) { log(e.message); }
      };
      document.getElementById('report').onclick = async () => {
        try { log(await client.getPackReport(pack)); openDebugDrawer(); }
        catch (e) { log(e.message); }
      };
    }

    document.getElementById('drawer')?.addEventListener('toggle', syncDebugHint);
    collapseDebugDrawer();

    // Inject icon sprite once, then boot UI
    fetch('/dev/agentic/icons.svg')
      .then((r) => r.text())
      .then((svg) => {
        document.getElementById('icon-host').innerHTML = svg;
        return client.getRunAllStatus().catch(() => null);
      })
      .then((st) => {
        if (st) lastRunState = st;
        return render();
      })
      .catch(() => render());
  </script>
</body>
</html>
