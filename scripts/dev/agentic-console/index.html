<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Rianell Agentic Harness</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,500;0,9..40,600;0,9..40,700;1,9..40,500&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet" />
  <style>
    :root {
      --bg: #070b09;
      --surface: #0e1511;
      --card: #121a15;
      --border: #1c2a22;
      --text: #e6f4ec;
      --muted: #7f968a;
      --accent: #5dd97a;
      --accent-dim: rgba(93, 217, 122, 0.14);
      --warn: #ffb74d;
      --bad: #ff6b6b;
      --idle: #3d5247;
      --radius: 14px;
      --font: "DM Sans", "Segoe UI", system-ui, sans-serif;
      --mono: "JetBrains Mono", ui-monospace, monospace;
    }
    * { box-sizing: border-box; }
    /* Hide scrollbars while keeping scroll (match PWA shell). */
    *, *::before, *::after {
      scrollbar-width: none;
      -ms-overflow-style: none;
    }
    *::-webkit-scrollbar { display: none; width: 0; height: 0; }
    body {
      margin: 0;
      font-family: var(--font);
      color: var(--text);
      min-height: 100vh;
      overflow-x: hidden;
      background:
        radial-gradient(900px 480px at 8% -8%, rgba(93, 217, 122, 0.12), transparent 55%),
        radial-gradient(700px 420px at 92% 0%, rgba(45, 90, 70, 0.35), transparent 50%),
        linear-gradient(180deg, #0b120e 0%, var(--bg) 40%);
    }
    .layout {
      display: grid;
      grid-template-columns: 248px 1fr;
      min-height: 100vh;
    }
    nav {
      border-right: 1px solid var(--border);
      background: rgba(14, 21, 17, 0.92);
      backdrop-filter: blur(10px);
      padding: 18px 12px 24px;
      display: flex;
      flex-direction: column;
      gap: 2px;
      overflow-y: auto;
      max-height: 100vh;
      position: sticky;
      top: 0;
    }
    .brand {
      display: flex; align-items: center; gap: 10px;
      padding: 4px 8px 16px; margin-bottom: 6px;
    }
    .brand-mark {
      width: 34px; height: 34px; border-radius: 10px;
      background: var(--accent-dim);
      border: 1px solid rgba(93, 217, 122, 0.35);
      display: grid; place-items: center;
      color: var(--accent);
    }
    .brand-mark svg { width: 18px; height: 18px; }
    .brand strong { display: block; font-size: 0.92rem; letter-spacing: 0.02em; }
    .brand span { font-size: 0.68rem; color: var(--muted); }
    .nav-sec {
      font-size: 0.65rem; text-transform: uppercase; letter-spacing: 0.08em;
      color: var(--idle); padding: 12px 10px 6px;
    }
    nav button {
      display: flex; align-items: center; gap: 10px;
      text-align: left; background: transparent; border: 0; color: var(--muted);
      padding: 8px 10px; border-radius: 10px; cursor: pointer; font: inherit; font-size: 0.86rem;
      transition: background .15s ease, color .15s ease, transform .15s ease;
    }
    nav button svg { width: 16px; height: 16px; flex-shrink: 0; opacity: 0.85; }
    nav button .dot {
      margin-left: auto; width: 7px; height: 7px; border-radius: 50%;
      background: var(--idle);
    }
    nav button[data-s="passed"] .dot { background: var(--accent); box-shadow: 0 0 8px rgba(93,217,122,.5); }
    nav button[data-s="broken"] .dot { background: var(--bad); }
    nav button[data-s="running"] .dot {
      background: var(--warn);
      animation: pulse 1.1s ease-in-out infinite;
    }
    nav button.active, nav button:hover {
      background: var(--card); color: var(--text);
    }
    nav button.active { box-shadow: inset 2px 0 0 var(--accent); }
    main { padding: 22px 28px 40px; min-width: 0; }
    .hud {
      display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 18px;
    }
    .chip {
      display: inline-flex; align-items: center; gap: 6px;
      padding: 6px 10px; border-radius: 999px;
      border: 1px solid var(--border); background: rgba(18, 26, 21, 0.9);
      font-size: 0.72rem; color: var(--muted);
    }
    .chip strong { color: var(--accent); font-weight: 600; }
    .chip svg { width: 12px; height: 12px; }
    .chip.warn-chip { color: var(--warn); border-color: rgba(255,183,77,.4); }
    .chip.bad-chip { color: var(--bad); border-color: rgba(255,107,107,.4); }
    .hero {
      display: grid; grid-template-columns: 1.2fr 0.8fr; gap: 18px;
      margin-bottom: 18px; align-items: stretch;
    }
    .hero-copy, .ring-card, .panel {
      background: linear-gradient(160deg, rgba(24,36,28,.9), rgba(14,20,17,.95));
      border: 1px solid var(--border);
      border-radius: calc(var(--radius) + 2px);
      padding: 20px 22px;
    }
    .hero h2 {
      font-size: clamp(1.5rem, 2.4vw, 2rem);
      margin: 0 0 8px; letter-spacing: -0.02em;
    }
    .hero p { color: var(--muted); margin: 0 0 16px; max-width: 42ch; line-height: 1.45; }
    .ring-card {
      display: grid; place-items: center; gap: 10px; text-align: center;
    }
    .ring {
      --pct: 0;
      width: 132px; height: 132px; border-radius: 50%;
      background: conic-gradient(var(--accent) calc(var(--pct) * 1%), var(--border) 0);
      display: grid; place-items: center;
      position: relative;
      animation: fadeUp .45s ease both;
    }
    .ring::before {
      content: ""; position: absolute; inset: 10px; border-radius: 50%;
      background: var(--surface);
    }
    .ring-inner {
      position: relative; z-index: 1;
      display: flex; flex-direction: column; align-items: center; gap: 2px;
    }
    .ring-inner b { font-size: 1.55rem; letter-spacing: -0.03em; }
    .ring-inner span { font-size: 0.68rem; color: var(--muted); text-transform: uppercase; letter-spacing: 0.06em; }
    .actions { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 16px; }
    .actions button, .pack-actions button, .btn {
      display: inline-flex; align-items: center; justify-content: center; gap: 8px;
      flex: 0 0 auto;
      background: var(--card); color: var(--text); border: 1px solid var(--border);
      border-radius: 12px; padding: 9px 13px; cursor: pointer;
      font: inherit; font-size: 0.85rem; font-weight: 600;
      white-space: nowrap;
      line-height: 1.2;
      max-width: 100%;
      transition: border-color .15s ease, transform .12s ease, background .15s ease;
    }
    /* display:inline-flex above would otherwise override HTML [hidden] */
    .actions button[hidden],
    .pack-actions button[hidden],
    .btn[hidden] {
      display: none !important;
    }
    .actions button svg, .pack-actions button svg, .btn svg,
    .pack-status-pill svg, .chip svg {
      width: 15px;
      height: 15px;
      flex: 0 0 15px;
      display: block;
      overflow: visible;
    }
    .actions button:hover, .pack-actions button:hover, .btn:hover {
      border-color: rgba(93,217,122,.35); transform: translateY(-1px);
    }
    .actions button.primary, .pack-actions button.primary, .btn.primary {
      border-color: rgba(93,217,122,.45);
      background: var(--accent-dim);
      color: var(--accent);
    }
    .actions button.danger, .pack-actions button.danger, .btn.danger {
      color: var(--bad);
      border-color: rgba(255, 107, 107, 0.55);
      background: rgba(255, 107, 107, 0.12);
    }
    .actions button.danger:hover, .pack-actions button.danger:hover, .btn.danger:hover {
      border-color: rgba(255, 107, 107, 0.75);
      background: rgba(255, 107, 107, 0.22);
      transform: translateY(-1px);
    }
    .actions button:disabled, .pack-actions button:disabled { opacity: 0.4; cursor: not-allowed; transform: none; }
    .pack-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(148px, 1fr));
      gap: 10px;
    }
    .pack-tile {
      border: 1px solid var(--border);
      background: var(--card);
      border-radius: var(--radius);
      padding: 14px 12px;
      cursor: pointer;
      text-align: left;
      color: inherit;
      font: inherit;
      display: grid;
      gap: 10px;
      transition: border-color .15s ease, transform .15s ease, background .15s ease;
      animation: fadeUp .4s ease both;
    }
    .pack-tile:hover { border-color: rgba(93,217,122,.4); transform: translateY(-2px); }
    .pack-tile .ico {
      width: 36px; height: 36px; border-radius: 10px;
      display: grid; place-items: center;
      background: var(--accent-dim); color: var(--accent);
    }
    .pack-tile .ico svg { width: 18px; height: 18px; }
    .pack-tile strong { font-size: 0.88rem; }
    .pack-tile small { color: var(--muted); font-size: 0.68rem; font-family: var(--mono); }
    .pack-tile[data-s="passed"] { border-color: rgba(93,217,122,.35); }
    .pack-tile[data-s="broken"] { border-color: rgba(255,107,107,.4); }
    .pack-tile[data-s="running"] { border-color: rgba(255,183,77,.45); }
    .status-row {
      display: flex; align-items: center; justify-content: space-between; gap: 8px;
    }
    .badge {
      display: inline-flex; align-items: center; gap: 4px;
      font-size: 0.65rem; text-transform: uppercase; letter-spacing: 0.05em;
      color: var(--muted);
    }
    .badge svg { width: 11px; height: 11px; }
    [data-s="passed"] .badge { color: var(--accent); }
    [data-s="broken"] .badge { color: var(--bad); }
    [data-s="running"] .badge { color: var(--warn); }
    .progress {
      margin: 0 0 14px; padding: 12px 14px; border-radius: var(--radius);
      border: 1px solid var(--border); background: var(--card);
    }
    .progress-top {
      display: flex; justify-content: space-between; gap: 12px; align-items: baseline;
      margin-bottom: 10px; font-size: 0.85rem;
    }
    .progress-top strong { color: var(--accent); }
    .bar {
      height: 8px; border-radius: 999px; background: var(--border); overflow: hidden;
    }
    .bar > i {
      display: block; height: 100%; width: 0%;
      background: linear-gradient(90deg, #3aa85a, var(--accent));
      transition: width .35s ease;
    }
    .timeline {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
      gap: 8px;
      margin: 8px 0 16px;
    }
    .step {
      display: grid;
      grid-template-columns: 28px 1fr auto;
      gap: 10px; align-items: center;
      padding: 10px 12px;
      border-radius: 12px;
      border: 1px solid var(--border);
      background: var(--card);
      font-size: 0.82rem;
    }
    .step.step-enter { animation: fadeUp .35s ease both; }
    .step .n {
      width: 28px; height: 28px; border-radius: 8px;
      display: grid; place-items: center;
      background: rgba(255,255,255,.03); color: var(--muted);
      font-family: var(--mono); font-size: 0.7rem;
    }
    .step .meta { display: flex; align-items: center; gap: 8px; min-width: 0; }
    .step .meta svg { width: 15px; height: 15px; color: var(--accent); flex-shrink: 0; }
    .step code { font-family: var(--mono); font-size: 0.78rem; }
    .step[data-s="passed"] { border-color: rgba(93,217,122,.35); }
    .step[data-s="broken"] { border-color: rgba(255,107,107,.4); }
    .step[data-s="running"] {
      border-color: rgba(255,183,77,.45);
      background: rgba(255,183,77,.06);
    }
    .step[data-s="skipped"] { opacity: 0.5; }
    .step[data-s="running"] .n { color: var(--warn); }
    .step[data-s="passed"] .n { color: var(--accent); }
    details.drawer {
      border: 1px solid var(--border);
      border-radius: var(--radius);
      background: #0a100d;
      margin-top: 8px;
    }
    details.drawer summary {
      cursor: pointer; padding: 10px 14px; color: var(--muted); font-size: 0.8rem;
      list-style: none;
      display: flex; align-items: center; gap: 8px;
      user-select: none;
    }
    details.drawer summary::-webkit-details-marker { display: none; }
    details.drawer summary::before {
      content: '▸';
      display: inline-block;
      width: 1em;
      color: var(--accent);
      transition: transform 0.15s ease;
    }
    details.drawer[open] summary::before { content: '▾'; }
    details.drawer summary .dbg-hint {
      margin-left: auto;
      font-size: 0.68rem;
      opacity: 0.7;
      font-family: var(--mono);
    }
    details.drawer:not([open]) #log { display: none; }
    pre {
      margin: 0; padding: 0 14px 14px;
      overflow: auto; max-height: 280px;
      font-family: var(--mono); font-size: 0.7rem; color: var(--muted);
    }
    label { font-size: 0.75rem; color: var(--muted); display: block; margin: 8px 0 4px; }
    select {
      background: var(--card); color: var(--text); border: 1px solid var(--border);
      border-radius: 10px; padding: 8px 10px; font: inherit;
    }
    .embed-frame {
      width: 100%; min-height: 520px; border: 1px solid var(--border);
      border-radius: var(--radius); background: #000; margin-top: 12px;
    }
    .visual-shell {
      display: flex; flex-direction: column; gap: 10px;
      min-height: calc(100vh - 120px);
    }
    .visual-shell .pack-stage-card {
      flex: 0 0 auto;
    }
    .visual-shell .pack-control-bar {
      flex: 0 1 auto;
      width: auto;
      max-width: 100%;
      justify-content: flex-start;
    }
    .visual-shell .pack-control-bar .pack-actions {
      width: 100%;
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 8px;
    }
    .visual-shell .pack-stage-body:empty,
    .visual-shell #packActivity:empty {
      display: none;
    }
    .visual-shell .embed-frame {
      flex: 1 1 auto;
      min-height: min(72vh, 820px);
      margin-top: 0;
      border-radius: 12px;
    }
    .warn { color: var(--warn); font-size: 0.85rem; }
    .pack-head {
      display: flex; align-items: center; gap: 12px; margin-bottom: 8px;
    }
    .pack-head .ico {
      width: 44px; height: 44px; border-radius: 12px;
      display: grid; place-items: center;
      background: var(--accent-dim); color: var(--accent);
    }
    .pack-head .ico svg { width: 22px; height: 22px; }

    /* Per-pack pipeline preview shell */
    .pack-stage {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }
    .pack-stage.pack-stage-enter {
      animation: fadeUp .35s ease both;
    }
    .pack-stage-card {
      border: 1px solid var(--border);
      border-radius: calc(var(--radius) + 2px);
      background: linear-gradient(165deg, rgba(24, 36, 28, 0.95), rgba(10, 16, 13, 0.98));
      overflow: hidden;
    }
    .pack-stage-head {
      display: flex;
      flex-wrap: wrap;
      align-items: flex-start;
      justify-content: space-between;
      gap: 14px;
      padding: 16px 18px 14px;
      border-bottom: 1px solid var(--border);
    }
    .pack-stage-title {
      display: flex;
      align-items: flex-start;
      gap: 12px;
      min-width: min(100%, 240px);
      flex: 1 1 220px;
    }
    .pack-stage-title > .ico {
      width: 44px;
      height: 44px;
      border-radius: 12px;
      display: grid;
      place-items: center;
      background: var(--accent-dim);
      color: var(--accent);
      flex: 0 0 44px;
    }
    .pack-stage-title > .ico svg {
      width: 22px;
      height: 22px;
      flex: 0 0 22px;
    }
    .pack-stage-title h2 {
      margin: 0;
      font-size: clamp(1.25rem, 2vw, 1.55rem);
      letter-spacing: -0.03em;
      line-height: 1.15;
    }
    .pack-stage-title .meta {
      margin: 4px 0 0;
      color: var(--muted);
      font-size: 0.78rem;
      font-family: var(--mono);
    }
    .pack-stage-title .insight {
      margin: 6px 0 0;
      color: var(--muted);
      font-size: 0.78rem;
      line-height: 1.4;
      max-width: 52ch;
    }
    .pack-status-pill {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      margin-top: 8px;
      padding: 4px 10px;
      border-radius: 999px;
      border: 1px solid var(--border);
      font-size: 0.68rem;
      text-transform: uppercase;
      letter-spacing: 0.06em;
      color: var(--muted);
    }
    .pack-status-pill[data-s="running"] {
      color: var(--warn);
      border-color: rgba(255,183,77,.4);
      background: rgba(255,183,77,.08);
    }
    .pack-status-pill[data-s="pending_approval"] {
      color: var(--warn);
      border-color: rgba(255,183,77,.4);
    }
    .pack-status-pill[data-s="passed"],
    .pack-status-pill[data-s="applied"] {
      color: var(--accent);
      border-color: rgba(93,217,122,.35);
      background: var(--accent-dim);
    }
    .pack-status-pill[data-s="broken"],
    .pack-status-pill[data-s="rejected"] {
      color: var(--bad);
      border-color: rgba(255,107,107,.4);
    }
    .pack-control-bar {
      display: flex;
      flex-wrap: wrap;
      align-items: flex-end;
      gap: 10px;
      flex: 1 1 320px;
      justify-content: flex-end;
      min-width: 0;
    }
    .pack-control-bar .field {
      display: flex;
      flex-direction: column;
      gap: 4px;
      min-width: 180px;
      flex: 1 1 180px;
      max-width: 280px;
    }
    .pack-control-bar .field label {
      margin: 0;
      font-size: 0.68rem;
      text-transform: uppercase;
      letter-spacing: 0.06em;
    }
    .pack-control-bar select {
      width: 100%;
      padding: 9px 11px;
    }
    .pack-control-bar .pack-actions {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin: 0;
    }
    .pipe-rail {
      display: flex;
      flex-wrap: wrap;
      gap: 0;
      list-style: none;
      margin: 0;
      padding: 0 10px 0;
      border-bottom: 1px solid var(--border);
    }
    .pipe-rail li {
      position: relative;
      flex: 1 1 100px;
      min-width: 0;
      margin: 0;
      padding: 0;
      color: var(--idle);
    }
    .pipe-rail .pipe-step-btn {
      width: 100%;
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 12px 14px 10px;
      border: 0;
      border-bottom: 2px solid transparent;
      background: transparent;
      color: inherit;
      font: inherit;
      font-size: 0.72rem;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      text-align: left;
      cursor: pointer;
      border-radius: 0;
    }
    .pipe-rail .pipe-step-btn:hover {
      background: rgba(93,217,122,.05);
      color: var(--text);
    }
    .pipe-rail li .n {
      width: 22px;
      height: 22px;
      border-radius: 7px;
      display: grid;
      place-items: center;
      font-family: var(--mono);
      font-size: 0.65rem;
      background: rgba(255,255,255,.03);
      border: 1px solid var(--border);
      flex-shrink: 0;
    }
    .pipe-rail li .lbl { min-width: 0; }
    .pipe-rail li .lbl b {
      display: block;
      color: inherit;
      font-size: 0.78rem;
      font-weight: 600;
      text-transform: none;
      letter-spacing: 0;
    }
    .pipe-rail li .lbl span {
      display: block;
      margin-top: 2px;
      font-size: 0.65rem;
      opacity: 0.85;
      text-transform: none;
      letter-spacing: 0;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .pipe-rail li[data-s="done"] { color: var(--accent); }
    .pipe-rail li[data-s="done"] .n {
      border-color: rgba(93,217,122,.4);
      background: var(--accent-dim);
      color: var(--accent);
    }
    .pipe-rail li[data-s="active"] { color: var(--warn); }
    .pipe-rail li[data-s="active"] .n {
      border-color: rgba(255,183,77,.45);
      background: rgba(255,183,77,.1);
      color: var(--warn);
      animation: pulse 1.2s ease-in-out infinite;
    }
    .pipe-rail li[data-s="fail"] { color: var(--bad); }
    .pipe-rail li[data-s="fail"] .n {
      border-color: rgba(255,107,107,.45);
      color: var(--bad);
    }
    .pipe-rail li[data-focus="1"] .pipe-step-btn {
      border-bottom-color: var(--accent);
      background: rgba(93,217,122,.07);
      color: var(--text);
    }
    .pack-stage-body {
      padding: 12px 14px 14px;
    }
    /* Stage wizard - one primary panel per Gates → Research → LLM → Proposal → Approve */
    .activity.wizard {
      display: flex;
      flex-direction: column;
      gap: 12px;
      margin: 0;
      grid-template-columns: none;
    }
    .wizard-meta {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      align-items: center;
    }
    .wizard-panel {
      display: none;
      flex-direction: column;
      gap: 12px;
      min-height: min(52vh, 480px);
      padding: 16px 16px 14px;
      border: 1px solid var(--border);
      border-radius: 12px;
      background: rgba(0,0,0,.16);
      animation: fadeUp .28s ease both;
    }
    .wizard-panel[data-open="1"] {
      display: flex;
    }
    .wizard-panel > header {
      display: flex;
      flex-wrap: wrap;
      align-items: baseline;
      justify-content: space-between;
      gap: 8px;
    }
    .wizard-panel > header h3 {
      margin: 0;
      font-size: 1rem;
      letter-spacing: -0.02em;
    }
    .wizard-panel > header p {
      margin: 0;
      color: var(--muted);
      font-size: 0.78rem;
      max-width: 48ch;
      line-height: 1.4;
    }
    .wizard-panel .body {
      flex: 1 1 auto;
      max-height: none;
      min-height: 0; /* allow flex child to shrink + scroll */
      white-space: pre-wrap;
    }
    .wizard-panel .body.md,
    .wizard-panel .body.plan-list {
      max-height: min(48vh, 420px);
      overflow: auto;
      scrollbar-width: thin;
    }
    .wizard-panel .activity-actions,
    .wizard-panel .wizard-nav,
    .wizard-panel .wizard-footer {
      flex: 0 0 auto;
    }
    .wizard-footer {
      display: flex;
      flex-direction: column;
      gap: 10px;
      margin-top: 4px;
      padding-top: 10px;
      border-top: 1px solid var(--border);
      background: rgba(8, 12, 10, 0.55);
      border-radius: 0 0 10px 10px;
    }
    .wizard-footer .wizard-nav {
      padding-top: 0;
      border-top: 0;
    }
    .wizard-footer .activity-actions {
      margin-top: 0;
    }
    .activity-actions {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin-top: 8px;
      align-items: center;
    }
    .activity-panel .activity-actions {
      flex: 0 0 auto;
      position: relative;
      z-index: 1;
      margin-top: 10px;
      padding-top: 10px;
      border-top: 1px solid var(--border);
    }
    .wizard-empty {
      display: grid;
      place-items: center;
      text-align: center;
      gap: 10px;
      min-height: 180px;
      padding: 24px 16px;
      color: var(--muted);
      border: 1px dashed var(--border);
      border-radius: 12px;
      background: rgba(255,255,255,.015);
    }
    .wizard-empty strong {
      display: block;
      color: var(--text);
      font-size: 0.95rem;
    }
    .wizard-empty span {
      display: block;
      font-size: 0.8rem;

      max-width: 36ch;
    }
    .wizard-nav {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      padding-top: 4px;
      border-top: 1px solid var(--border);
    }
    .wizard-nav .pack-hop {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
    }
    .activity.cockpit {
      grid-template-columns: 1.55fr 1fr;
      grid-template-areas:
        "now now"
        "think plan"
        "done plan";
      gap: 10px;
      margin: 0;
    }
    .activity.cockpit[data-no-planned="1"] {
      grid-template-columns: 1fr 1fr;
      grid-template-areas:
        "now done"
        "think think";
    }
    .activity.cockpit .ap-now { grid-area: now; min-height: 0; }
    .activity.cockpit .ap-think { grid-area: think; min-height: 200px; }
    .activity.cockpit .ap-done { grid-area: done; min-height: 0; }
    .activity.cockpit .ap-plan { grid-area: plan; min-height: 200px; }
    .activity.cockpit .ap-think .body {
      max-height: min(42vh, 360px);
    }
    .activity.cockpit .ap-plan .body {
      max-height: min(32vh, 280px);
    }
    .activity.cockpit .now-metrics {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      white-space: normal;
    }
    .activity.cockpit .metric {
      display: flex;
      flex-direction: column;
      gap: 2px;
      padding: 8px 12px;
      border-radius: 10px;
      border: 1px solid var(--border);
      background: rgba(0,0,0,.18);
      min-width: 110px;
    }
    .activity.cockpit .metric span {
      font-size: 0.65rem;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      color: var(--muted);
    }
    .activity.cockpit .metric strong {
      font-size: 0.9rem;
      font-weight: 600;
      color: var(--text);
    }
    .done-chips {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      white-space: normal;
    }
    .done-chips .chip {
      max-width: 100%;
    }
    .spin { animation: spin 0.9s linear infinite; transform-origin: center; }
    @keyframes spin { to { transform: rotate(360deg); } }
    @keyframes pulse {
      0%, 100% { opacity: 1; transform: scale(1); }
      50% { opacity: 0.45; transform: scale(0.85); }
    }
    @keyframes fadeUp {
      from { opacity: 0; transform: translateY(6px); }
      to { opacity: 1; transform: none; }
    }
    dialog.confirm-dlg {
      border: 1px solid var(--border);
      border-radius: calc(var(--radius) + 4px);
      padding: 0;
      max-width: min(420px, calc(100vw - 32px));
      width: 100%;
      color: var(--text);
      background: linear-gradient(160deg, rgba(24, 36, 28, 0.98), rgba(10, 16, 13, 0.98));
      box-shadow: 0 24px 64px rgba(0, 0, 0, 0.55), 0 0 0 1px rgba(93, 217, 122, 0.08);
    }
    dialog.confirm-dlg::backdrop {
      background: rgba(4, 8, 6, 0.72);
      backdrop-filter: blur(4px);
    }
    dialog.confirm-dlg[open] {
      animation: fadeUp 0.18s ease-out;
    }
    .confirm-dlg .cd-body { padding: 22px 22px 8px; }
    .confirm-dlg .cd-ico {
      width: 40px; height: 40px; border-radius: 12px;
      display: grid; place-items: center; margin-bottom: 12px;
      background: rgba(255, 183, 77, 0.12);
      color: var(--warn);
      border: 1px solid rgba(255, 183, 77, 0.35);
    }
    .confirm-dlg .cd-ico svg { width: 20px; height: 20px; }
    .confirm-dlg h3 {
      margin: 0 0 8px; font-size: 1.1rem; letter-spacing: -0.02em;
    }
    .confirm-dlg p {
      margin: 0; color: var(--muted); font-size: 0.88rem; line-height: 1.45;
    }
    .confirm-dlg .cd-actions {
      display: flex; justify-content: flex-end; gap: 8px;
      padding: 16px 22px 20px;
    }
    .confirm-dlg .cd-actions button { min-width: 96px; }
    .confirm-dlg .cd-actions button.danger {
      color: var(--bad);
      border-color: rgba(255, 107, 107, 0.55);
      background: rgba(255, 107, 107, 0.12);
    }
    .confirm-dlg .cd-actions button.danger:hover {
      background: rgba(255, 107, 107, 0.22);
      border-color: rgba(255, 107, 107, 0.75);
    }
    .confirm-dlg.danger .cd-ico {
      background: rgba(255, 107, 107, 0.12);
      color: var(--bad);
      border-color: rgba(255, 107, 107, 0.4);
    }
    .activity {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 10px;
      margin: 12px 0 16px;
    }
    .activity-panel {
      border: 1px solid var(--border);
      border-radius: var(--radius);
      background: var(--card);
      padding: 12px 14px;
      min-height: 120px;
    }
    .activity-panel h3 {
      margin: 0 0 8px;
      font-size: 0.72rem;
      text-transform: uppercase;
      letter-spacing: 0.06em;
      color: var(--muted);
    }
    .activity-panel .body {
      font-size: 0.85rem;
      line-height: 1.45;
      white-space: pre-wrap;
      max-height: 220px;
      overflow: auto;
      scrollbar-width: none;
      -ms-overflow-style: none;
    }
    .activity-panel .body::-webkit-scrollbar { display: none; }
    .activity-panel .body.md h1,
    .activity-panel .body.md h2,
    .activity-panel .body.md h3 { font-size: 0.95rem; margin: 0.4em 0 0.2em; }
    .activity-panel .body.md ul { margin: 0.3em 0; padding-left: 1.2em; }
    .plan-item {
      display: grid;
      grid-template-columns: auto 1fr auto;
      gap: 8px;
      align-items: start;
      padding: 8px 0;
      border-top: 1px solid var(--border);
      font-size: 0.8rem;

    .plan-item:first-of-type { border-top: 0; }
    .plan-item .risk-high { color: var(--bad); }
    .plan-item .risk-medium { color: var(--warn); }
    .approval-queue {
      border: 1px solid rgba(255,183,77,.35);
      background: rgba(255,183,77,.06);
      border-radius: 12px;
      padding: 10px 12px;
      margin: 10px 0;
      font-size: 0.82rem;
    }
    .cursor-blink::after {
      content: '\25AE';
      animation: pulse 1s step-end infinite;
      color: var(--accent);
    }
    @media (max-width: 960px) {
      .activity { grid-template-columns: 1fr; }
      .activity.cockpit,
      .activity.cockpit[data-no-planned="1"] {
        grid-template-columns: 1fr;
        grid-template-areas:
          "now"
          "think"
          "done"
          "plan";
      }
      .pack-control-bar { justify-content: flex-start; }
      .pipe-rail li { flex: 1 1 45%; }
    }
    @media (max-width: 960px) {
      .layout { grid-template-columns: 1fr; }
      nav {
        position: static; max-height: none;
        flex-direction: row; flex-wrap: wrap;
      }
      .hero { grid-template-columns: 1fr; }
      .nav-sec { width: 100%; }
    }
  </style>
</head>
<body>
  <div id="icon-host" hidden></div>
  <div class="layout">
    <nav id="nav"></nav>
    <main>
      <div class="hud" id="hud">Loading…</div>
      <div id="view"></div>
      <details class="drawer" id="drawer">
        <summary>Debug (raw JSON) <span class="dbg-hint">collapsed · click to expand</span></summary>
        <pre id="log"></pre>
      </details>
    </main>
  </div>
  <dialog id="confirmDlg" class="confirm-dlg" aria-labelledby="confirmTitle" aria-describedby="confirmMsg">
    <form method="dialog" id="confirmForm">
      <div class="cd-body">
        <div class="cd-ico" id="confirmIco" aria-hidden="true"></div>
        <h3 id="confirmTitle">Confirm</h3>
        <p id="confirmMsg"></p>
      </div>
      <div class="cd-actions">
        <button type="submit" value="cancel" class="btn" id="confirmCancel">Cancel</button>
        <button type="submit" value="ok" class="btn primary" id="confirmOk">Continue</button>
      </div>
    </form>
  </dialog>
  <script type="module">
    import { createAgenticClient } from '/dev/agentic/lib/agentic-api-client.js';

    const client = createAgenticClient();
    const PACKS = [
      'design','planning','rtl','a11y','seo','privacy','security',
      'deps','migration','bootllm','perf','changelog','wikisync','image','i18n','visual'
    ];
    const NAV = [
      { id: 'overview', group: 'Control' },
      { id: 'run-all', group: 'Control' },
      ...PACKS.map((id) => ({ id, group: 'Packs' })),
      { id: 'settings', group: 'System' },
    ];

    let catalog = null;
    let state = { view: 'overview' };
    let lastRunState = null;
    let runAllPoll = null;
    let runAllPollMs = 2500;
    let lastTimelineFp = '';
    let lastHudOk = '';
    let lastHudAt = 0;
    let pollNote = '';
    let lastDebugCollapseView = null;

    const icon = (name, cls = '') =>
      `<svg class="ico-svg ${cls}" width="15" height="15" viewBox="0 0 24 24" aria-hidden="true" focusable="false"><use href="#i-${name}"></use></svg>`;

    function syncDebugHint() {
      const d = document.getElementById('drawer');
      const hint = d?.querySelector('.dbg-hint');
      if (!hint) return;
      hint.textContent = d.open ? 'click to collapse' : 'collapsed · click to expand';
    }

    function collapseDebugDrawer() {
      const d = document.getElementById('drawer');
      if (d) d.open = false;
      syncDebugHint();
    }

    function openDebugDrawer() {
      const d = document.getElementById('drawer');
      if (d) d.open = true;
      syncDebugHint();
    }

    /** Write raw JSON into the debug drawer without auto-expanding it. */
    function log(x) {
      const el = document.getElementById('log');
      if (el) el.textContent = typeof x === 'string' ? x : JSON.stringify(x, null, 2);
    }

    function runStateFingerprint(runState) {
      if (!runState) return 'idle';
      const results = runState.results || {};
      const keys = Object.keys(results).sort();
      const resultBits = keys.map((k) => {
        const r = results[k] || {};
        return `${k}:${r.ok ? 1 : 0}:${r.needsApproval ? 1 : 0}:${r.approvalState || ''}`;
      }).join(',');
      const packs = runState.packs || {};
      const packBits = Object.keys(packs).sort()
        .map((k) => `${k}:${packs[k]?.status || ''}/${packs[k]?.stage || ''}`)
        .join(',');
      return [
        runState.status || '',
        runState.dryRun ? 'd' : 'l',
        runState.currentPack || '',
        runState.stepIndex ?? '',
        (runState.order || []).join('|'),
        (runState.skip || []).join('|'),
        resultBits,
        packBits,
      ].join('::');
    }

    function packSnapshotBusy(packs) {
      for (const id of Object.keys(packs || {})) {
        const s = packs[id]?.status;
        if (s === 'running' || s === 'paused' || s === 'polish_running' || s === 'queued_apply') {
          return true;
        }
      }
      return false;
    }

    /** Keep polling while any pipeline / apply / pack work is in flight. */
    function shouldKeepUiPolling(runState, runAct) {
      const st = runState?.status;
      if (st === 'running' || st === 'paused') return true;
      if ((runAct?.applyQueue?.pending || 0) > 0) return true;
      if (packSnapshotBusy(runState?.packs)) return true;
      // Approval queue still deserves soft updates while human works across tabs.
      if (st === 'awaiting_approvals' && (runAct?.approvalQueue?.length || 0) > 0) return true;
      if (PACKS.includes(state.view)) {
        const mine = runState?.packs?.[state.view];
        if (mine && (mine.status === 'running' || mine.status === 'paused'
          || mine.status === 'polish_running' || mine.status === 'queued_apply')) {
          return true;
        }
      }
      return false;
    }

    /** In-app confirm (replaces window.confirm). Resolves true/false. */
    function uiConfirm({
      title = 'Confirm',
      message = '',
      okLabel = 'Continue',
      cancelLabel = 'Cancel',
      iconName = 'run-all',
      danger = false,
    } = {}) {
      const dlg = document.getElementById('confirmDlg');
      const okBtn = document.getElementById('confirmOk');
      document.getElementById('confirmTitle').textContent = title;
      document.getElementById('confirmMsg').textContent = message;
      okBtn.textContent = okLabel;
      okBtn.classList.toggle('primary', !danger);
      okBtn.classList.toggle('danger', danger);
      dlg.classList.toggle('danger', danger);
      document.getElementById('confirmCancel').textContent = cancelLabel;
      document.getElementById('confirmIco').innerHTML = icon(iconName);
      return new Promise((resolve) => {
        const onClose = () => {
          dlg.removeEventListener('close', onClose);
          resolve(dlg.returnValue === 'ok');
        };
        dlg.addEventListener('close', onClose);
        if (typeof dlg.showModal === 'function') dlg.showModal();
        else {
          /* rare fallback */
          resolve(window.confirm(`${title}\n\n${message}`));
        }
        queueMicrotask(() => okBtn.focus());
      });
    }

    function stopRunAllPoll() {
      if (runAllPoll) { clearInterval(runAllPoll); runAllPoll = null; }
    }

    function stepStatus(packId, runState) {
      if (!runState) return 'pending';
      const skip = new Set(runState.skip || []);
      if (skip.has(packId)) return 'skipped';
      // Prefer live pack status from run-all snapshot when present (e.g. pending_approval).
      const packSnap = runState.packs?.[packId];
      if (packSnap?.status === 'pending_approval' || packSnap?.status === 'applied'
        || packSnap?.status === 'rejected' || packSnap?.status === 'passed'
        || packSnap?.status === 'broken' || packSnap?.status === 'dry_run'
        || packSnap?.status === 'queued_apply'
        || packSnap?.status === 'running' || packSnap?.status === 'paused') {
        if (packSnap.status === 'running' || packSnap.status === 'paused') {
          /* fall through - also respect results */
        } else if (packSnap.status === 'queued_apply') {
          return 'pending_approval';
        } else {
          return packSnap.status;
        }
      }
      const r = (runState.results || {})[packId];
      if (r) {
        if (r.needsApproval || r.approvalState === 'pending') return 'pending_approval';
        if (r.approvalState === 'queued') return 'pending_approval';
        return r.ok ? 'passed' : 'broken';
      }
      if (runState.currentPack === packId && (runState.status === 'running' || runState.status === 'paused')) {
        return 'running';
      }
      if (runState.status === 'running' || runState.status === 'paused'
        || runState.status === 'awaiting_approvals') {
        const order = runState.order || PACKS;
        const idx = order.indexOf(packId);
        if (idx >= 0 && idx < (runState.stepIndex || 0)) return 'passed';
      }
      return 'pending';
    }

    function statusBadge(s) {
      if (s === 'passed') return `<span class="badge">${icon('check')} passed</span>`;
      if (s === 'broken') return `<span class="badge">${icon('x')} broken</span>`;
      if (s === 'running') return `<span class="badge">${icon('spin', 'spin')} running</span>`;
      if (s === 'skipped') return `<span class="badge">skipped</span>`;
      if (s === 'pending_approval') return `<span class="badge">${icon('pause')} needs approval</span>`;
      return `<span class="badge">${icon('dot')} pending</span>`;
    }

    function escapeHtml(s) {
      return String(s ?? '').replace(/[&<>"']/g, (c) => ({
        '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;',
      })[c]);
    }

    function renderMd(text) {
      const raw = String(text || '');
      const escaped = escapeHtml(raw)
        .replace(/^### (.+)$/gm, '<h3>$1</h3>')
        .replace(/^## (.+)$/gm, '<h2>$1</h2>')
        .replace(/^# (.+)$/gm, '<h1>$1</h1>')
        .replace(/^\- (.+)$/gm, '<li>$1</li>')
        .replace(/(<li>.*<\/li>\n?)+/g, (m) => `<ul>${m}</ul>`)
        .replace(/\*\*(.+?)\*\*/g, '<b>$1</b>')
        .replace(/`([^`]+)`/g, '<code>$1</code>');
      return escaped;
    }

    let wizardStep = 'gates';
    let wizardFollow = true;

    function isVisualPack(pack, act) {
      return pack === 'visual' || act?.pack === 'visual';
    }

    function deriveWizardStep(act, pack) {
      const now = act?.now || {};
      const status = now.status || 'idle';
      const stage = String(now.stage || '');
      if (isVisualPack(pack, act)) {
        if (status === 'pending_approval' || status === 'queued_apply') return 'approve';
        if (stage === 'polish' || status === 'polish_running' || /polish/i.test(stage)) return 'polish';
        if (stage === 'qa' || stage === 'screenshot' || /qa/i.test(stage)) return 'qa';
        if (stage === 'research') return 'research';
        if (status === 'running' && (stage === 'gates' || stage === 'check' || !stage)) return 'gates';
        if ((act?.planned?.items || []).some((it) => it.kind === 'visual_repolish' || it.kind === 'ack_only')) {
          return status === 'running' ? 'polish' : 'approve';
        }
        if (status === 'broken' && /gate/i.test(stage)) return 'gates';
        return 'gates';
      }
      if (status === 'pending_approval' || status === 'queued_apply' || status === 'applied' || status === 'rejected') {
        return status === 'pending_approval' || status === 'queued_apply' ? 'approve' : 'approve';
      }
      if (status === 'broken' && /gate/i.test(stage)) return 'gates';
      if (status === 'broken' && stage === 'llm') return 'llm';
      if (stage === 'research') return 'research';
      if (stage === 'llm' || (status === 'running' && stage === 'llm')) return 'llm';
      if (stage === 'post' || stage === 'pending_approval') return 'proposal';
      if (status === 'running' && (stage === 'gates' || stage === 'check' || stage === 'default' || !stage)) return 'gates';
      if ((act?.planned?.items || []).length) return 'proposal';
      if (act?.research?.text && status === 'running') return 'research';
      if ((act?.done || []).length && status !== 'idle') return 'llm';
      return 'gates';
    }

    function focusWizardStep(step, { pin = false, pack = '' } = {}) {
      const visual = isVisualPack(pack, null) || ['qa', 'polish'].includes(step);
      const allowed = visual
        ? ['gates', 'research', 'qa', 'approve', 'polish']
        : ['gates', 'research', 'llm', 'proposal', 'approve'];
      if (!allowed.includes(step)) step = 'gates';
      wizardStep = step;
      if (pin) wizardFollow = false;
      document.querySelectorAll('.wizard-panel[data-step]').forEach((el) => {
        el.dataset.open = el.dataset.step === step ? '1' : '0';
      });
      document.querySelectorAll('.pipe-rail li[data-step]').forEach((li) => {
        li.dataset.focus = li.dataset.step === step ? '1' : '0';
      });
      const root = document.getElementById('activityRoot');
      if (root) root.dataset.wizardStep = step;
    }

    function wirePipeRail(pack) {
      const rail = document.querySelector('.pack-stage .pipe-rail');
      if (!rail) return;
      rail.querySelectorAll('.pipe-step-btn').forEach((btn) => {
        btn.onclick = () => {
          const step = btn.closest('[data-step]')?.dataset.step;
          if (!step) return;
          focusWizardStep(step, { pin: true, pack });
        };
      });
      // Re-apply focus after rail HTML swap.
      focusWizardStep(wizardStep, { pin: !wizardFollow, pack });
    }

    function wizardEmpty(title, detail) {
      return `<div class="wizard-empty"><strong>${escapeHtml(title)}</strong><span>${escapeHtml(detail)}</span></div>`;
    }

    function packNeighbors(pack) {
      const i = PACKS.indexOf(pack);
      return {
        prev: i > 0 ? PACKS[i - 1] : null,
        next: i >= 0 && i < PACKS.length - 1 ? PACKS[i + 1] : null,
      };
    }

    /** Derive Gates → … rail states for a pack. */
    function pipeRailHtml(act, opts = {}) {
      const now = act?.now || {};
      const status = now.status || 'idle';
      const stage = String(now.stage || '');
      const doneGates = (act?.done || []).filter((d) => d.status === 'pass' || d.status === 'skipped-dry-run');
      const plannedItems = act?.planned?.items || [];
      const focus = opts.focusStep || wizardStep || 'gates';
      const visual = isVisualPack(opts.pack, act);

      const running = status === 'running';
      const broken = status === 'broken';
      const pending = status === 'pending_approval' || status === 'queued_apply';
      const finishedOk = status === 'passed' || status === 'applied' || status === 'dry_run';
      const rejected = status === 'rejected';
      const polishRun = stage === 'polish' || status === 'polish_running';

      if (visual) {
        const gateS = broken && /gate/i.test(stage)
          ? 'fail'
          : (doneGates.length || stage === 'research' || stage === 'qa' || pending || polishRun || finishedOk)
            ? 'done'
            : (running && (!stage || stage === 'gates' || stage === 'check'))
              ? 'active'
              : 'idle';
        const research = act?.research;
        const resS = stage === 'research' && running
          ? 'active'
          : (research?.text || stage === 'qa' || pending || polishRun || finishedOk)
            ? 'done'
            : 'idle';
        const qaS = stage === 'qa' && running
          ? 'active'
          : (pending || polishRun || finishedOk || plannedItems.length)
            ? 'done'
            : 'idle';
        const apprS = status === 'applied' || polishRun
          ? 'done'
          : rejected
            ? 'fail'
            : pending
              ? 'active'
              : 'idle';
        const polS = polishRun && running
          ? 'active'
          : (finishedOk || status === 'applied')
            ? 'done'
            : 'idle';
        const brokenN = plannedItems.filter((it) => it.kind === 'visual_repolish').length;
        const steps = [
          { id: 'gates', n: '1', title: 'Gates', sub: gateS === 'done' ? `${doneGates.length || 'ok'}` : (gateS === 'active' ? 'running' : 'wait'), s: gateS },
          { id: 'research', n: '2', title: 'Research', sub: resS === 'active' ? 'Firecrawl' : (research?.sources ? `${research.sources} src` : 'web brief'), s: resS },
          { id: 'qa', n: '3', title: 'Q&A', sub: qaS === 'active' ? 'scanning' : (brokenN ? `${brokenN} candidates` : 'find polish'), s: qaS },
          { id: 'approve', n: '4', title: 'Approve', sub: pending ? 'select candidates' : (polishRun ? 'queued' : 'gated'), s: apprS },
          { id: 'polish', n: '5', title: 'Polish×8', sub: polishRun ? 'Pass 1…8' : 'after approve', s: polS },
        ];
        return `<ol class="pipe-rail" role="tablist" aria-label="Visual pack stages">
          ${steps.map((st) => `
            <li data-s="${st.s}" data-step="${st.id}" data-focus="${st.id === focus ? '1' : '0'}">
              <button type="button" class="pipe-step-btn" role="tab" aria-selected="${st.id === focus ? 'true' : 'false'}">
                <span class="n">${st.n}</span>
                <span class="lbl"><b>${st.title}</b><span>${escapeHtml(st.sub)}</span></span>
              </button>
            </li>`).join('')}
        </ol>`;
      }

      const research = act?.research;
      const gateS = broken && /gate/i.test(stage)
        ? 'fail'
        : (doneGates.length || stage === 'research' || stage === 'llm' || pending || finishedOk || rejected)
          ? 'done'
          : (running && (!stage || stage === 'gates' || stage === 'check' || stage === 'default'))
            ? 'active'
            : 'idle';
      const resS = stage === 'research' && running
        ? 'active'
        : (research?.text || stage === 'llm' || pending || finishedOk || rejected || stage === 'pending_approval' || stage === 'post')
          ? 'done'
          : 'idle';
      const llmS = broken && stage === 'llm'
        ? 'fail'
        : (stage === 'llm' && running)
          ? 'active'
          : (pending || finishedOk || rejected || stage === 'pending_approval' || stage === 'post')
            ? 'done'
            : 'idle';
      const propS = pending
        ? 'done'
        : (finishedOk || rejected || (plannedItems.length && !running))
          ? 'done'
          : (running && stage === 'post')
            ? 'active'
            : 'idle';
      const apprS = status === 'applied'
        ? 'done'
        : rejected
          ? 'fail'
          : pending
            ? 'active'
            : 'idle';

      const steps = [
        { id: 'gates', n: '1', title: 'Gates', sub: gateS === 'done' ? `${doneGates.length || 'ok'}` : (gateS === 'active' ? 'running' : 'wait'), s: gateS },
        { id: 'research', n: '2', title: 'Research', sub: resS === 'active' ? 'Firecrawl' : (research?.sources ? `${research.sources} src` : 'web brief'), s: resS },
        { id: 'llm', n: '3', title: 'LLM', sub: now.model || (llmS === 'active' ? 'streaming' : 'advisory'), s: llmS },
        { id: 'proposal', n: '4', title: 'Proposal', sub: plannedItems.length ? `${plannedItems.length} item(s)` : (propS === 'active' ? 'building' : '-'), s: propS },
        {
          id: 'approve',
          n: '5',
          title: 'Approve',
          sub: pending ? 'needs you' : (status === 'applied' ? 'applied' : (rejected ? 'rejected' : 'gated')),
          s: apprS,
        },
      ];

      return `<ol class="pipe-rail" role="tablist" aria-label="Pack pipeline stages">
        ${steps.map((st) => `
          <li data-s="${st.s}" data-step="${st.id}" data-focus="${st.id === focus ? '1' : '0'}">
            <button type="button" class="pipe-step-btn" role="tab" aria-selected="${st.id === focus ? 'true' : 'false'}">
              <span class="n">${st.n}</span>
              <span class="lbl"><b>${st.title}</b><span>${escapeHtml(st.sub)}</span></span>
            </button>
          </li>`).join('')}
      </ol>`;
    }

    function activityHtml(act, opts = {}) {
      const cockpit = opts.layout === 'cockpit';
      const wizard = opts.layout === 'wizard';
      if (opts.hideActivity === true) {
        return '';
      }
      if (!act && !wizard) {
        return `<div class="activity${cockpit ? ' cockpit' : ''}" id="activityRoot"><div class="activity-panel ap-now"><h3>Now</h3><div class="body">No activity yet</div></div></div>`;
      }
      const now = act?.now || {};
      const thinking = act?.thinking || {};
      const done = act?.done || [];
      const planned = act?.planned || {};
      const items = planned.items || [];
      const visual = isVisualPack(opts.pack, act);
      const hidePlanned = opts.hidePlanned === true;
      const fill = thinking.fillProgress;
      const ctx = thinking.context;
      const ctxChip = ctx?.filesUsed?.length
        ? `<div class="chip" style="margin-bottom:0.5rem" title="${escapeHtml((ctx.filesUsed || []).join('\n'))}">repo context · ${ctx.filesUsed.length} files · ${ctx.charCount || 0} chars</div>`
        : '';
      const thinkText = fill
        ? `Filling ${fill.locale || '…'} · ${fill.done || 0}/${fill.total || 0}`
          + (fill.sampleTranslation ? `\n\n${fill.lastKey}: ${fill.sampleTranslation}` : '')
          + (thinking.text ? `\n\n${thinking.text}` : '')
        : (thinking.text || '');
      const pack = opts.pack || act?.pack || '';
      const hops = packNeighbors(pack);
      const hopHtml = `
        <div class="pack-hop">
          ${hops.prev ? `<button type="button" class="btn" data-pack-hop="${hops.prev}">${icon('rtl')} ${escapeHtml(hops.prev)}</button>` : ''}
          ${hops.next ? `<button type="button" class="btn" data-pack-hop="${hops.next}">${escapeHtml(hops.next)} ${icon('run-all')}</button>` : ''}
        </div>`;

      if (wizard && visual) {
        const active = opts.focusStep || (wizardFollow ? deriveWizardStep(act, pack) : wizardStep) || 'gates';
        const research = act?.research;
        const gateBody = done.length
          ? `<div class="body done-chips">${done.map((d) => `<span class="chip">${escapeHtml(d.label)} · ${escapeHtml(d.status)}</span>`).join('')}</div>`
          : wizardEmpty('Gates not started', 'Dry-run or Live runs verify:icon-spec before Q&A.');
        const researchBody = research?.text
          ? `<div class="body md">${renderMd(research.text)}</div>`

        const qaBody = thinkText
          ? `<div class="body md">${renderMd(thinkText)}</div>`

        const planListApprove = items.length ? `
          <div class="body plan-list" style="white-space:normal" id="plannedBody">
            ${items.map((it) => `
              <label class="plan-item">
                <input type="checkbox" data-item="${escapeHtml(it.id)}" ${it.selected !== false ? 'checked' : ''} />
                <span>
                  <strong>${escapeHtml(it.title)}</strong>
                  <div style="color:var(--muted);font-size:0.75rem">${escapeHtml((it.detail || '').slice(0, 180))}</div>
                </span>
                <span class="risk-${escapeHtml(it.risk || 'low')}">${escapeHtml(it.kind === 'visual_repolish' ? 'polish' : (it.risk || 'low'))}</span>
              </label>`).join('')}
          </div>` : wizardEmpty('No candidates', 'Run Live so Q&A can populate polish candidates.');
        const approveActions = `
            <div class="activity-actions">
              <button class="btn primary" id="btnApprove">${icon('check')} Approve → Polish×8</button>
              <button class="btn" id="btnReject">${icon('x')} Reject</button>
            </div>`;
        const polishBody = wizardEmpty(
          'Polish×8',
          'After Approve, Gemma re-polishes selected candidates through up to 8 Q&A rounds. Watch C-only Live polish below.',
        );
        return `
        <div class="activity wizard" id="activityRoot" data-wizard-step="${active}" data-visual="1">
          <div class="wizard-meta">
            <span class="chip">Status <strong>${escapeHtml(now.status || 'idle')}</strong></span>
            <span class="chip">Stage <strong>${escapeHtml(now.stage || '-')}</strong></span>
            ${now.needsApproval ? '<span class="chip warn-chip">select candidates</span>' : ''}
            ${now.dryRun ? '<span class="chip">dry-run</span>' : ''}
          </div>
          <section class="wizard-panel" data-step="gates" data-open="${active === 'gates' ? '1' : '0'}">
            <header><h3>1 · Gates</h3><p>Icon-spec verify before research / Q&A spend.</p></header>
            ${gateBody}
            <div class="wizard-nav">
              <button type="button" class="btn" data-wiz-next="research">Next · Research ${icon('run-all')}</button>
              ${hopHtml}
            </div>
          </section>
          <section class="wizard-panel" data-step="research" data-open="${active === 'research' ? '1' : '0'}">
            <header><h3>2 · Research</h3><p>Firecrawl web brief - grounds later Approve decisions.</p></header>
            ${researchBody}
            <div class="wizard-nav">
              <button type="button" class="btn" data-wiz-prev="gates">${icon('rtl')} Gates</button>
              <button type="button" class="btn" data-wiz-next="qa">Next · Q&A ${icon('run-all')}</button>
            </div>
          </section>
          <section class="wizard-panel" data-step="qa" data-open="${active === 'qa' ? '1' : '0'}">
            <header><h3>3 · Q&A</h3><p>Screenshot Q&A finds glyphs that need polish.</p></header>
            ${qaBody}
            <div class="wizard-nav">
              <button type="button" class="btn" data-wiz-prev="research">${icon('rtl')} Research</button>
              <button type="button" class="btn" data-wiz-next="approve">Next · Approve</button>
            </div>
          </section>
          <section class="wizard-panel" data-step="approve" data-open="${active === 'approve' ? '1' : '0'}">
            <header><h3>4 · Approve</h3><p>Pick candidates - Approve starts Polish×8 (no product write).</p></header>
            ${planListApprove}
            <div class="wizard-footer">
              ${approveActions}
              <div class="wizard-nav">
                <button type="button" class="btn" data-wiz-prev="qa">${icon('rtl')} Q&A</button>
                <button type="button" class="btn" data-wiz-next="polish">Next · Polish×8</button>
