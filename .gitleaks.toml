# Gitleaks configuration for CI (see .github/workflows/ci.yml - security-audit job).
# Scans the working tree with --no-git (not full git history) so old commits are not re-flagged.

title = "Rianell"

[extend]
useDefault = true

[allowlist]
description = "Templates; local gitignored secrets; dependencies and build dirs; README (may quote example CLI output / docs that look like secrets); i18n UI strings (password labels trigger generic-api-key false positives)"
paths = [
  '''^README\.md$''',
  '''^security/\.env\.example$''',
  '''^security/\.env$''',
  '''^security/\.encryption_key$''',
  '''^web/supabase-config\.example\.js$''',
  '''^node_modules/''',
  '''^\.venv/''',
  '''^venv/''',
  '''^ENV/''',
  '''^dist/''',
  '''^build/''',
  '''^logs/''',
  '''^apps/pwa-webapp/\.trace-build/''',
  '''^apps/pwa-webapp/vendor/transformers/''',
  '''^\.firecrawl/''',
  '''^artifacts/''',
  '''^scripts/lib/tier-a-exact-overrides\.mjs$''',
  '''^packages/build-tools/src/tier-a-exact-overrides\.mjs$''',
  '''^i18n-packs/''',
  '''^apps/pwa-webapp/i18n-packs/''',
  '''^apps/rn-app/i18n-packs/''',
  '''^packages/shared/i18n-packs/''',
]
