# Exclude vendored third-party bundles that trip partner patterns (e.g. HashiCorp
# Vault: s. + 24 alnum chars matches Transformers.js Deberta-style exports).
# Same tree is allowlisted in .gitleaks.toml.
# https://docs.github.com/en/code-security/secret-scanning/excluding-folders-from-secret-scanning
paths-ignore:
  - "apps/pwa-webapp/vendor/transformers/**"
