# =============================================================================
# Security & dependency audits (reusable only — invoked from ci.yml)
# =============================================================================
name: Reusable security audits

on:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read
  security-events: write

concurrency:
  group: security-audit-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  security-audit:
    name: Secret scan & dependency audits
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Gitleaks (secret scan, working tree)
        run: |
          set -euo pipefail
          VERSION=8.28.0
          curl -sSfL "https://github.com/gitleaks/gitleaks/releases/download/v${VERSION}/gitleaks_${VERSION}_linux_x64.tar.gz" | tar -xz
          chmod +x gitleaks
          ./gitleaks detect --source . --config .gitleaks.toml --no-git --verbose --exit-code 1 --redact

      - name: Verify no service_role in client sources
        run: node scripts/verify-no-service-role-in-clients.mjs

      - name: Verify Supabase RLS baseline SQL (docs)
        run: node scripts/verify-rls-baseline.mjs

      - name: Verify privacy documentation
        run: node scripts/verify-privacy-docs.mjs

      - name: Verify CSP connect-src
        run: node scripts/verify-csp-connect-src.mjs

      - name: Set up Node
        uses: actions/setup-node@v5
        with:
          node-version: "24.14.1"
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies (npm ci, all workspaces)
        run: npm ci

      - name: Verify security inventory doc (pull requests)
        if: github.event_name == 'pull_request'
        run: |
          node scripts/generate-security-inventory.mjs
          git diff --exit-code docs/security-inventory.md

      - name: Vulnerability scan — npm audit (production deps)
        run: npm audit --audit-level=high --omit=dev

      - name: Benchmark security audit
        run: node scripts/audit-benchmark-security.mjs

      - name: Vulnerability scan — npm audit (dev, non-blocking)
        if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
        continue-on-error: true
        run: npm audit --audit-level=moderate

      - name: Vulnerability scan — OSV-Scanner (OSV.dev)
        run: |
          set -euo pipefail
          VERSION=2.3.5
          curl -sSfL "https://github.com/google/osv-scanner/releases/download/v${VERSION}/osv-scanner_linux_amd64" -o osv-scanner
          chmod +x osv-scanner
          ./osv-scanner scan -L package-lock.json --format sarif --output osv-npm.sarif || true
          ./osv-scanner scan -L package-lock.json
          ./osv-scanner scan -L requirements.txt

      - name: Upload OSV SARIF
        if: always() && hashFiles('osv-npm.sarif') != ''
        uses: github/codeql-action/upload-sarif@v3
        continue-on-error: true
        with:
          sarif_file: osv-npm.sarif
          category: osv-scanner

      - name: Generate CycloneDX SBOM (artifact)
        continue-on-error: true
        run: |
          npx --yes @cyclonedx/cyclonedx-npm@1.19.0 --output-file sbom.cdx.json --omit dev
      - uses: actions/upload-artifact@v5
        if: always() && hashFiles('sbom.cdx.json') != ''
        with:
          name: sbom-cyclonedx
          path: sbom.cdx.json

      - name: Snyk SCA (optional, SNYK_TOKEN)
        continue-on-error: true
        env:
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
        run: |
          if [ -z "${SNYK_TOKEN:-}" ]; then
            echo "SNYK_TOKEN not configured — skipping Snyk"
            exit 0
          fi
          npm install -g snyk
          snyk test --all-projects --severity-threshold=high || true

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Vulnerability scan — pip-audit (requirements.txt)
        run: |
          python -m pip install --upgrade pip
          python -m pip install pip-audit
          pip-audit -r requirements.txt --desc on --ignore-vuln CVE-2026-4539
