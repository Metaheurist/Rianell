name: Security DAST
on:
  pull_request:
    branches: [main]
  schedule:
    - cron: '0 2 * * 1'
jobs:
  zap-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-node-ci
        with:
          install: true
          cache-node-modules: true
      - name: Build PWA
        run: npm run build:web
      - name: Start PWA server
        run: |
          npx serve apps/pwa-webapp -p 8080 &
          sleep 8
      - name: OWASP ZAP Baseline Scan
        uses: zaproxy/action-baseline@v0.12.0
        with:
          target: 'http://localhost:8080'
          rules_file_name: '.zap/rules.tsv'
          cmd_options: '-a -j'
          fail_action: true
      - name: Upload ZAP report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: zap-report
          path: report_html.html

  axe-accessibility:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-node-ci
        with:
          install: true
          cache-node-modules: true
      - name: Build PWA
        run: npm run build:web
      - name: Axe audit contract
        run: node scripts/audit/run-axe-audit.mjs --dry-run

  mobsf-scan:
    runs-on: ubuntu-latest
    if: github.event_name == 'schedule'
    steps:
      - uses: actions/checkout@v4
      - name: Run MobSF static scan
        uses: MobSF/mobsfscan@v0.3.8
        with:
          args: '. --json -o mobsf-report.json'
      - name: Upload MobSF report
        uses: actions/upload-artifact@v4
        with:
          name: mobsf-report
          path: mobsf-report.json
