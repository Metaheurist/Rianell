# =============================================================================
# Rianell — unified GitHub Actions (main CI)
# =============================================================================
# Human docs: wiki/Build-Test-and-CI.md
# Security audits: reusable `.github/workflows/security-audit.yml` (not a standalone trigger).
#
# Pipeline phases (job keys — file order matches DAG):
#   Phase 0 — paths-filter
#   Phase 1 — unit-tests | prepare-minified-assets | security-audit  (max 3 parallel)
#   Phase 2 — benchmarks-web | deploy-pages | expo-bundle-prod | server-exe |
#             commit-dependencies-doc | sync-wiki-to-github | rn-build-version  (max 7 parallel)
#   Phase 3 — benchmarks-expo | rncli-android-apk | rncli-ios-zip | audit-boot-post-deploy
#   Phase 4 — commit-benchmarks | commit-app-build | publish-release |
#             readme-build-info | security-headers-report
#
# Gate jobs call cancel-workflow-on-failure on failure. Benchmark jobs do not (reports still upload).
# Bot jobs that git-push use concurrency group ci-bot-push-${{ github.ref }} to avoid push races.
#
# Dependency caching (invalidates when lockfiles / versions change):
#   npm — setup-node-ci | pip — setup-python-ci | Playwright — install-playwright-chromium
#   Expo/Metro — cache-expo | Gradle + Android SDK — rncli-android-apk
#   PyInstaller + UPX — server-exe | Gitleaks/OSV — security-audit.yml
# =============================================================================

name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

# Hosted runners default to Node 24 for JS actions (Jun 2026).
# First-party pins: cache/setup-java/pages/github-script/softprops on Node 24 (v5/v8/v3+).
# Job Node runtime: setup-node-ci @ 24.14.1.

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # ═══════════════════════════════════════════════════════════════════════════
  # Phase 0 — Gate
  # ═══════════════════════════════════════════════════════════════════════════
  paths-filter:
    name: "0 · Path gate (mobile release)"
    runs-on: ubuntu-latest
    outputs:
      mobile_release: ${{ steps.out.outputs.mobile_release }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - id: out
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            echo "mobile_release=false" >> $GITHUB_OUTPUT
          elif [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "mobile_release=true" >> $GITHUB_OUTPUT
          elif [ "${{ github.event_name }}" = "push" ]; then
            BEFORE="${{ github.event.before }}"
            SHA="${{ github.sha }}"
            if [ "$BEFORE" = "0000000000000000000000000000000000000000" ]; then
              echo "mobile_release=true" >> $GITHUB_OUTPUT
            else
              CHANGED=$(git diff --name-only "$BEFORE" "$SHA" 2>/dev/null || true)
              if [ -z "$CHANGED" ]; then
                echo "mobile_release=false" >> $GITHUB_OUTPUT
              elif echo "$CHANGED" | grep -qv '^artifacts/'; then
                echo "mobile_release=true" >> $GITHUB_OUTPUT
              else
                echo "mobile_release=false" >> $GITHUB_OUTPUT
              fi
            fi
          else
            echo "mobile_release=false" >> $GITHUB_OUTPUT
          fi

  # ═══════════════════════════════════════════════════════════════════════════
  # Phase 1 — Foundation (parallel after gate)
  # ═══════════════════════════════════════════════════════════════════════════
  unit-tests:
    name: "1 · Unit tests and platform parity"
    needs: [paths-filter]
    if: github.event_name == 'pull_request' || github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: write
    steps:
      - uses: actions/checkout@v5

      - uses: ./.github/actions/setup-node-ci

      - name: Run app unit tests
        run: npm run test:unit

      - name: Accessibility token contrast (WCAG AA)
        run: npm run verify:a11y-tokens

      - name: Doc links and stale path scan
        run: node scripts/verify/doc-links.mjs --strict

      - name: Design token guardrails (critical UI files)
        run: npm run verify:design-tokens

      - name: Root directory hygiene (Phase 23)
        run: npm run verify:root-hygiene

      - name: Nested lockfile guard (workspaces)
        run: node scripts/verify/nested-lockfile-guard.mjs

      - name: GitHub Actions Node 24 pin guard
        run: node scripts/verify/verify-github-actions-node24.mjs

      - name: Production dependency license check
        run: npx --yes license-checker@25.0.1 --production --excludePrivatePackages --onlyAllow "MIT;Apache-2.0;BSD-2-Clause;BSD-3-Clause;ISC;CC0-1.0;0BSD;Python-2.0;BlueOak-1.0.0"

      - name: Platform parity checks
        run: |
          npm run parity:web
          npm run parity:android
          npm run parity:ios
          npm run parity:inventory:check

      - name: Verify docs/dependencies.md matches manifests (pull requests only)
        if: github.event_name == 'pull_request'
        run: |
          node scripts/ci/generate-dependencies-doc.mjs
          git diff --exit-code docs/dependencies.md

      - name: Verify docs/security-inventory.md (pull requests only)
        if: github.event_name == 'pull_request'
        run: |
          node scripts/ci/generate-security-inventory.mjs
          git diff --exit-code docs/security-inventory.md

      - name: Security doc and client verification scripts
        run: |
          node scripts/verify/verify-privacy-docs.mjs
          node scripts/verify/verify-policy-packs.mjs
          npm run verify:i18n
          npm run verify:llm-security
          node scripts/test/llm-golden-prompts.mjs
          node scripts/verify/verify-csp-connect-src.mjs
          node scripts/verify/verify-sri-integrity.mjs
          node scripts/verify/verify-ropa-drift.mjs
          node scripts/verify/verify-no-service-role-in-clients.mjs
          node scripts/models/verify-no-model-weights-in-git.mjs

      - name: Cancel workflow on failure
        if: failure()
        uses: ./.github/actions/cancel-workflow-on-failure

  prepare-minified-assets:
    name: "1 · Prepare minified web assets"
    needs: [paths-filter]
    if: github.event_name == 'pull_request' || github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: write
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
          lfs: true

      - uses: ./.github/actions/setup-node-ci

      - name: Sync locale packs to PWA
        run: |
          node scripts/i18n/generate-locale-overrides.mjs
          node scripts/i18n/sync-i18n-assets.mjs

      - name: Build PWA vendor bundles + minified web (temp)
        run: |
          npm run vendor:transformers
          npm run build:web:apk

      - name: Prepare minified temp directories
        run: |
          rm -rf "ci-minified"
          mkdir -p "ci-minified"
          cp -r "apps/pwa-webapp/.android-dist" "ci-minified/web-android-dist"

          mkdir -p "ci-minified/site"
          cp -r apps/pwa-webapp/* "ci-minified/site/"
          # Glob copy skips dot-directories; security.txt must ship at /.well-known/security.txt
          if [ -d "apps/pwa-webapp/.well-known" ]; then
            cp -r apps/pwa-webapp/.well-known "ci-minified/site/.well-known"
          fi
          if [ -f "apps/pwa-webapp/.nojekyll" ]; then
            cp apps/pwa-webapp/.nojekyll "ci-minified/site/.nojekyll"
          fi
          rm -rf "ci-minified/site/models/onnx-community" "ci-minified/site/models/checksums.json" 2>/dev/null || true
          if [ -d "artifacts" ]; then
            mkdir -p "ci-minified/site/artifacts"
            cp -r "artifacts/"* "ci-minified/site/artifacts/" 2>/dev/null || true
          fi
          node apps/pwa-webapp/build-site.mjs --site "ci-minified/site" --skip-trace

          node -e "
          const fs = require('fs');
          function assertBundle(root, label) {
            const mPath = root + '/asset-manifest.json';
            if (!fs.existsSync(mPath)) throw new Error(label + ': missing asset-manifest.json');
            const m = JSON.parse(fs.readFileSync(mPath, 'utf8'));
            if (!m.mainJs) throw new Error(label + ': asset-manifest missing mainJs');
            if (!fs.existsSync(root + '/' + m.mainJs)) throw new Error(label + ': missing ' + m.mainJs);
          }
          assertBundle('ci-minified/web-android-dist', 'web-android-dist');
          assertBundle('ci-minified/site', 'site');
          if (!fs.existsSync('ci-minified/site/vendor/rianell-shared.js')) throw new Error('missing vendor/rianell-shared.js');
          const vendorWasm = 'ci-minified/site/vendor/transformers/ort-wasm-simd-threaded.jsep.wasm';
          if (!fs.existsSync(vendorWasm)) throw new Error('missing vendor/transformers wasm — run npm run vendor:transformers');
          if (fs.statSync(vendorWasm).size < 1000000) throw new Error('vendor wasm too small (corrupt or LFS pointer)');
          if (!fs.existsSync('ci-minified/site/vendor/transformers/transformers.min.js')) throw new Error('missing vendor/transformers/transformers.min.js');
          if (!fs.existsSync('ci-minified/site/.well-known/security.txt')) throw new Error('missing .well-known/security.txt in Pages site build');
          if (!fs.existsSync('ci-minified/site/.nojekyll')) throw new Error('missing .nojekyll in Pages site build');
          "

      - name: Upload minified temp artifact
        id: upload_minified
        continue-on-error: true
        uses: actions/upload-artifact@v5
        with:
          name: minified-prebuild
          path: ci-minified/
          retention-days: 1

      - name: Retry upload minified temp artifact (transient ECONNRESET)
        id: upload_minified_retry
        if: steps.upload_minified.outcome == 'failure'
        uses: actions/upload-artifact@v5
        with:
          name: minified-prebuild
          path: ci-minified/
          retention-days: 1

      - name: Fail if artifact upload did not succeed
        if: steps.upload_minified.outcome == 'failure' && steps.upload_minified_retry.outcome != 'success'
        run: exit 1

      - name: Cancel workflow on failure
        if: failure()
        uses: ./.github/actions/cancel-workflow-on-failure

  security-audit:
    name: "1 · Security and supply-chain audit"
    needs: [paths-filter]
    if: github.event_name == 'pull_request' || github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    permissions:
      contents: read
      security-events: write
      actions: write
    uses: ./.github/workflows/security-audit.yml
    secrets: inherit

  # ═══════════════════════════════════════════════════════════════════════════
  # Phase 2 — Build lanes (parallel after Phase 1)
  # ═══════════════════════════════════════════════════════════════════════════
  benchmarks-web:
    name: "2 · Benchmarks (web / PWA)"
    needs: [paths-filter, prepare-minified-assets]
    if: github.event_name == 'pull_request' || github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: ./.github/actions/setup-node-ci

      - name: Download minified prebuild
        uses: actions/download-artifact@v5
        with:
          name: minified-prebuild
          path: ci-minified

      - uses: ./.github/actions/install-playwright-chromium

      - name: Run web benchmarks
        env:
          BENCHMARK_REPO_ROOT: ${{ github.workspace }}
          BENCHMARK_PWA_ROOT: ${{ github.workspace }}/ci-minified/site
          BENCHMARK_SKIP_README: "1"
        run: node benchmarks/scripts/run-web-benchmarks.mjs

      - name: Record PWA bundle sizes
        run: node benchmarks/scripts/bundle-sizes.mjs "${{ github.workspace }}/ci-minified/site" --enforce-budget

      - name: Upload benchmark reports (web)
        uses: actions/upload-artifact@v5
        with:
          name: benchmarks-web
          path: |
            benchmarks/web-pwa
            benchmarks/github-pages
          retention-days: 1

  deploy-pages:
    name: "2 · Deploy GitHub Pages"
    needs: [prepare-minified-assets, unit-tests, security-audit]
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    environment: pages
    concurrency:
      group: pages
      cancel-in-progress: false
    permissions:
      contents: read
      pages: write
      id-token: write
      actions: write
    steps:
      - uses: actions/checkout@v5
        with:
          lfs: true

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Download minified temp artifact
        uses: actions/download-artifact@v5
        with:
          name: minified-prebuild
          path: ci-minified

      - name: Prepare GitHub Pages site (minified bundle + Supabase)
        uses: ./.github/actions/prepare-pages-site
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
          VAPID_PUBLIC_KEY: ${{ secrets.VAPID_PUBLIC_KEY }}
          SMARTLOOK_PROJECT_KEY: ${{ secrets.SMARTLOOK_PROJECT_KEY }}

      - name: Upload prepared site for post-deploy audit
        uses: actions/upload-artifact@v5
        with:
          name: pages-site-probe
          path: site
          retention-days: 1

      - name: Upload artifact (web app + artifacts as site root)
        uses: actions/upload-pages-artifact@v5
        with:
          path: site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Cancel workflow on failure
        if: failure()
        uses: ./.github/actions/cancel-workflow-on-failure

  expo-bundle-prod:
    name: "2 · Expo prod bundle (gate)"
    needs: [paths-filter, unit-tests, security-audit]
    if: github.event_name == 'pull_request' || github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: write
    steps:
      - uses: actions/checkout@v5

      - uses: ./.github/actions/setup-node-ci

      - uses: ./.github/actions/cache-expo

      - name: Typecheck + test Expo app
        run: |
          npm run typecheck:mobile
          npm run test:mobile

      - name: Expo export — production bundles (Android + iOS)
        env:
          EXPO_NO_TELEMETRY: "1"
          NODE_ENV: production
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_PUBLISHABLE_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
          EXPO_PUBLIC_SMARTLOOK_PROJECT_KEY: ${{ secrets.SMARTLOOK_PROJECT_KEY }}
        run: |
          node scripts/build/run-mobile-export.mjs
          npm ls expo-modules-autolinking
          test -d "apps/rn-app/dist-expo-prod"

      - name: Verify Android Hermes bundle (.hbc)
        run: test -f apps/rn-app/dist-expo-prod/_expo/static/js/android/*.hbc

      - name: Verify iOS Hermes bundle (.hbc)
        run: test -f apps/rn-app/dist-expo-prod/_expo/static/js/ios/*.hbc

      - name: Upload Expo bundle artifact
        uses: actions/upload-artifact@v5
        with:
          name: expo-bundles
          path: apps/rn-app/dist-expo-prod/
          retention-days: 1

      - name: Cancel workflow on failure
        if: failure()
        uses: ./.github/actions/cancel-workflow-on-failure

  server-exe:
    name: "2 · Server EXE (${{ matrix.arch }})"
    needs: [paths-filter, unit-tests, security-audit]
    if: |
      github.event_name == 'pull_request' ||
      ((github.event_name == 'push' || github.event_name == 'workflow_dispatch') && needs.paths-filter.outputs.mobile_release == 'true')
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        arch: [x64, x86]
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          architecture: ${{ matrix.arch }}
          cache: pip
          cache-dependency-path: |
            requirements.txt
            .github/ci-pip-extras.txt
            .github/ci-pip-audit-tools.txt

      - name: Cache PyInstaller build cache
        uses: actions/cache@v5
        with:
          path: |
            ~\AppData\Local\pyinstaller
          key: pyinstaller-${{ matrix.arch }}-${{ hashFiles('requirements.txt', '.github/ci-pip-extras.txt') }}

      - name: Install server dependencies
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip install -r .github/ci-pip-extras.txt

      - name: Cache UPX (Chocolatey)
        uses: actions/cache@v5
        id: upx-cache
        with:
          path: |
            C:\ProgramData\chocolatey\lib\upx
            C:\ProgramData\chocolatey\bin\upx.exe
          key: upx-choco-${{ runner.os }}-${{ matrix.arch }}-v1
          restore-keys: |
            upx-choco-${{ runner.os }}-

      - name: Install UPX (best-effort)
        if: steps.upx-cache.outputs.cache-hit != 'true'
        shell: pwsh
        run: |
          if (Get-Command upx -ErrorAction SilentlyContinue) {
            Write-Host "UPX already on PATH"
            exit 0
          }
          try {
            choco install upx -y --no-progress
          } catch {
            Write-Host "UPX install failed; continuing without UPX compression."
          }

      - name: Build server EXE
        shell: pwsh
        run: |
          $entryScript = "server/main.py"
          try {
            python -m pyarmor gen -r -O ".ci-obf" server
            if (Test-Path ".ci-obf/server/main.py") {
              $entryScript = ".ci-obf/server/main.py"
              Write-Host "Using obfuscated entry script: $entryScript"
            } else {
              Write-Host "Obfuscated entry not found; using source entry script."
            }
          } catch {
            Write-Host "PyArmor obfuscation failed; falling back to source entry script."
          }

          $upxPath = (Get-Command upx -ErrorAction SilentlyContinue).Source
          $pyArgs = @(
            "--noconfirm",
            "--clean",
            "--onefile",
            "--optimize", "2",
            "--name", "rianell-server-${{ matrix.arch }}"
          )
          if ($upxPath) {
            $pyArgs += @("--upx-dir", (Split-Path -Parent $upxPath))
            Write-Host "Using UPX from: $upxPath"
          } else {
            Write-Host "UPX not found; building without UPX compression."
          }
          python -m PyInstaller @pyArgs $entryScript
          New-Item -ItemType Directory -Force -Path "artifacts/Server" | Out-Null
          Copy-Item "dist/rianell-server-${{ matrix.arch }}.exe" "artifacts/Server/rianell-server-${{ matrix.arch }}.exe" -Force
          Set-Content -Path "artifacts/Server/latest-${{ matrix.arch }}.json" -Value "{""version"":${{ github.run_number }},""file"":""rianell-server-${{ matrix.arch }}.exe""}"
          if ("${{ matrix.arch }}" -eq "x64") {
            Copy-Item "artifacts/Server/latest-${{ matrix.arch }}.json" "artifacts/Server/latest.json" -Force
          }

      - name: Upload server EXE artifact
        uses: actions/upload-artifact@v5
        with:
          name: server-exe-${{ matrix.arch }}
          path: artifacts/Server/
          retention-days: 1

      - name: Artifact note (PR)
        if: github.event_name == 'pull_request'
        shell: pwsh
        run: |
          Write-Host "Server artifact is available as 'server-exe-${{ matrix.arch }}' on this run."

  commit-dependencies-doc:
    name: "2 · Commit dependencies inventory"
    needs: [unit-tests]
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master')
    runs-on: ubuntu-latest
    concurrency:
      group: ci-bot-push-${{ github.ref }}
      cancel-in-progress: false
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Sync branch with origin
        run: |
          git fetch origin "${{ github.ref_name }}"
          git checkout -B "${{ github.ref_name }}" "origin/${{ github.ref_name }}"

      - name: Regenerate docs/dependencies.md
        run: node scripts/ci/generate-dependencies-doc.mjs

      - name: Commit and push if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add docs/dependencies.md
          git diff --staged --quiet && { echo "No dependency doc changes"; exit 0; }
          git commit -m "chore(docs): refresh dependencies.md from manifests [skip ci]"
          git push origin "${{ github.ref_name }}"

  sync-wiki-to-github:
    name: "2 · Sync wiki to GitHub Wiki"
    needs: [unit-tests]
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master')
    runs-on: ubuntu-latest
    concurrency:
      group: ci-bot-push-${{ github.ref }}
      cancel-in-progress: false
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Detect wiki/ changes
        id: wiki_changes
        run: |
          if git diff --name-only "${{ github.event.before }}" "${{ github.sha }}" | grep -q '^wiki/'; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
          else
            echo "changed=false" >> "$GITHUB_OUTPUT"
          fi

      - uses: ./.github/actions/setup-node-ci
        with:
          install: "false"
          cache-node-modules: "false"

      - name: Verify and sync wiki
        if: steps.wiki_changes.outputs.changed == 'true'
        env:
          WIKI_PUSH_TOKEN: ${{ secrets.WIKI_PUSH_TOKEN }}
          GIT_AUTHOR_NAME: github-actions[bot]
          GIT_AUTHOR_EMAIL: github-actions[bot]@users.noreply.github.com
        run: |
          test -n "$WIKI_PUSH_TOKEN" || { echo "WIKI_PUSH_TOKEN secret required for wiki sync"; exit 1; }
          node scripts/wiki/sync-wiki.mjs --ci-token "$WIKI_PUSH_TOKEN"

  rn-build-version:
    name: "2 · RN CI sequential build number"
    needs: [paths-filter]
    if: |
      (github.event_name == 'push' || github.event_name == 'workflow_dispatch') &&
      needs.paths-filter.outputs.mobile_release == 'true'
    runs-on: ubuntu-latest
    outputs:
      rn_build: ${{ steps.calc.outputs.rn_build }}
    steps:
      - uses: actions/checkout@v5

      - id: calc
        shell: bash
        run: |
          set -euo pipefail
          PREV=0
          if [ -f "artifacts/RNCLI-Android/latest.json" ]; then
            PREV=$(node -e "const j=require('./artifacts/RNCLI-Android/latest.json'); process.stdout.write(String(parseInt(j.version,10)||0));" 2>/dev/null || echo 0)
          fi
          NEXT=$((PREV + 1))
          echo "rn_build=$NEXT" >> "$GITHUB_OUTPUT"
          echo "RN sequential build: $NEXT (previous $PREV)"

  # ═══════════════════════════════════════════════════════════════════════════
  # Phase 3 — Downstream builds and post-deploy audit
  # ═══════════════════════════════════════════════════════════════════════════
  benchmarks-expo:
    name: "3 · Benchmarks (Expo / RN)"
    needs: [paths-filter, expo-bundle-prod]
    if: github.event_name == 'pull_request' || github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: ./.github/actions/setup-node-ci

      - name: Download Expo bundle output
        uses: actions/download-artifact@v5
        with:
          name: expo-bundles
          path: apps/rn-app/dist-expo-prod

      - name: Run Expo bundle stats
        env:
          BENCHMARK_REPO_ROOT: ${{ github.workspace }}
          BUNDLE_ROOT: ${{ github.workspace }}/apps/rn-app/dist-expo-prod
          BENCHMARK_SKIP_README: "1"
        run: node benchmarks/scripts/expo-bundle-stats.mjs

      - name: Upload benchmark reports (expo)
        uses: actions/upload-artifact@v5
        with:
          name: benchmarks-expo
          path: benchmarks/expo-rn
          retention-days: 1

  rncli-android-apk:
    name: "3 · Android APK (React Native CI)"
    needs: [paths-filter, expo-bundle-prod, rn-build-version]
    if: |
      (github.event_name == 'push' || github.event_name == 'workflow_dispatch') &&
      needs.paths-filter.outputs.mobile_release == 'true'
    runs-on: ubuntu-latest
    env:
      RIANELL_EXPO_EXPORT_STUB_NATIVE_LLM: "1"
    steps:
      - uses: actions/checkout@v5

      - name: Free disk space (remove unused toolchains)
        run: |
          df -h /
          sudo rm -rf /usr/local/lib/android/sdk/ndk /usr/local/lib/android/sdk/system-images \
            /usr/local/lib/android/sdk/emulator /opt/hostedtoolcache/CodeQL \
            /usr/local/.ghcup /usr/share/dotnet /opt/ghc \
            "$AGENT_TOOLSDIRECTORY/node" 2>/dev/null || true
          sudo apt-get clean 2>/dev/null || true
          df -h /

      - uses: ./.github/actions/setup-node-ci

      - uses: ./.github/actions/cache-expo

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: "temurin"
          java-version: "17"

      - uses: ./.github/actions/cache-android-sdk

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools platforms;android-36 build-tools;36.0.0 ndk;27.1.12297006

      - name: Restore Gradle cache
        uses: actions/cache@v5
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
            apps/rn-app/android/.gradle
          key: gradle-${{ runner.os }}-${{ hashFiles('package-lock.json', 'apps/rn-app/package.json') }}
          restore-keys: |
            gradle-${{ runner.os }}-

      - name: Generate native project (expo prebuild -> RN CLI)
        working-directory: apps/rn-app
        env:
          CI: "1"
          EXPO_NO_TELEMETRY: "1"
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_PUBLISHABLE_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
          EXPO_PUBLIC_SMARTLOOK_PROJECT_KEY: ${{ secrets.SMARTLOOK_PROJECT_KEY }}
        run: npx expo prebuild --platform android --no-install

      - name: Assemble Android debug APK
        working-directory: apps/rn-app/android
        run: ./gradlew assembleDebug --no-daemon

      - name: Assemble signed release APK (when keystore secret configured)
        working-directory: apps/rn-app/android
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
        run: |
          set -euo pipefail
          if [ -z "${KEYSTORE_BASE64:-}" ]; then
            echo "KEYSTORE_BASE64 not configured — skipping release APK"
            exit 0
          fi
          echo "$KEYSTORE_BASE64" | base64 -d > /tmp/rianell-release.jks
          cat >> gradle.properties <<EOF
          RIANELL_RELEASE_STORE_FILE=/tmp/rianell-release.jks
          RIANELL_RELEASE_KEY_ALIAS=${KEY_ALIAS}
          RIANELL_RELEASE_STORE_PASSWORD=${STORE_PASSWORD}
          RIANELL_RELEASE_KEY_PASSWORD=${KEY_PASSWORD}
          EOF
          ./gradlew assembleRelease --no-daemon

      - name: Collect APK + latest.json
        shell: bash
        env:
          RN_BUILD: ${{ needs.rn-build-version.outputs.rn_build }}
        run: |
          set -euo pipefail
          mkdir -p rncli-android-dist
          shopt -s nullglob
          apks=(apps/rn-app/android/app/build/outputs/apk/debug/*.apk)
          if [ ${#apks[@]} -eq 0 ]; then
            echo "No APKs found under apps/rn-app/android/app/build/outputs/apk/debug"
            exit 1
          fi
          cp -v "${apks[0]}" rncli-android-dist/app-debug-beta.apk
          release_apks=(apps/rn-app/android/app/build/outputs/apk/release/*.apk)
          if [ ${#release_apks[@]} -gt 0 ]; then
            cp -v "${release_apks[0]}" rncli-android-dist/app-release-signed.apk
          fi
          echo "{\"version\":${RN_BUILD},\"file\":\"app-debug-beta.apk\",\"downloadUrl\":\"https://github.com/Metaheurist/Rianell/releases/latest/download/app-debug-beta.apk\"}" > rncli-android-dist/latest.json

      - name: Upload Android dist
        uses: actions/upload-artifact@v5
        with:
          name: rncli-android-dist
          path: rncli-android-dist/
          retention-days: 1

  rncli-ios-zip:
    name: "3 · iOS emulator Xcode project zip"
    needs: [paths-filter, expo-bundle-prod, rn-build-version]
    if: |
      (github.event_name == 'push' || github.event_name == 'workflow_dispatch') &&
      needs.paths-filter.outputs.mobile_release == 'true'
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v5

      - uses: ./.github/actions/setup-node-ci

      - uses: ./.github/actions/cache-expo

      - name: Generate native project (expo prebuild -> RN CLI)
        working-directory: apps/rn-app
        env:
          CI: "1"
          EXPO_NO_TELEMETRY: "1"
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_PUBLISHABLE_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
          EXPO_PUBLIC_SMARTLOOK_PROJECT_KEY: ${{ secrets.SMARTLOOK_PROJECT_KEY }}
        run: npx expo prebuild --platform ios --no-install

      - name: Zip iOS project for emulator usage
        shell: bash
        env:
          RN_BUILD: ${{ needs.rn-build-version.outputs.rn_build }}
        run: |
          set -euo pipefail
          mkdir -p rncli-ios-dist
          run="${RN_BUILD}"
          zip -r "rncli-ios-dist/Health-Tracker-ios-alpha-build-${run}.zip" "apps/rn-app/ios"
          cp -f "rncli-ios-dist/Health-Tracker-ios-alpha-build-${run}.zip" "rncli-ios-dist/Health-Tracker-ios-alpha-latest.zip"
          cp -f "rncli-ios-dist/Health-Tracker-ios-alpha-build-${run}.zip" "rncli-ios-dist/Health-Tracker-simulator-alpha-${run}.zip"
          echo "{\"version\":${run},\"file\":\"Health-Tracker-ios-alpha-build-${run}.zip\",\"simulatorFile\":\"Health-Tracker-simulator-alpha-${run}.zip\",\"installUrl\":\"https://rianell.com/artifacts/iOS/Health-Tracker-ios-alpha-latest.zip\"}" > rncli-ios-dist/latest.json

      - name: Upload iOS dist
        uses: actions/upload-artifact@v5
        with:
          name: rncli-ios-dist
          path: rncli-ios-dist/
          retention-days: 1

  playwright-e2e:
    name: "3 · Playwright E2E smoke"
    needs: [deploy-pages]
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master')
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: ./.github/actions/setup-node-ci
      - uses: ./.github/actions/install-playwright-chromium
      - uses: ./.github/actions/setup-python-ci
      - name: Download deployed Pages site
        uses: actions/download-artifact@v5
        with:
          name: pages-site-probe
          path: site
      - name: Start probe server
        env:
          RIANELL_WEB_DIR: ${{ github.workspace }}/site
          PORT: "9876"
          HOST: "127.0.0.1"
        run: |
          set -euo pipefail
          python -m server >/tmp/e2e-server.log 2>&1 &
          MAIN_JS=$(node -pe "JSON.parse(require('fs').readFileSync('site/asset-manifest.json','utf8')).mainJs")
          for i in $(seq 1 20); do
            if curl -fsS "http://127.0.0.1:9876/${MAIN_JS}" -o /dev/null; then exit 0; fi
            sleep 2
          done
          tail -n 40 /tmp/e2e-server.log || true
          exit 1
      - name: Run Playwright smoke tests
        env:
          PROBE_URL: http://127.0.0.1:9876/
        run: npx playwright test --config benchmarks/playwright.config.ts

  lighthouse-ci:
    name: "3 · Lighthouse CI (Pages probe)"
    needs: [deploy-pages]
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: ./.github/actions/setup-node-ci
      - uses: ./.github/actions/install-playwright-chromium
      - uses: ./.github/actions/setup-python-ci
      - name: Download deployed Pages site
        uses: actions/download-artifact@v5
        with:
          name: pages-site-probe
          path: site
      - name: Start probe server
        env:
          RIANELL_WEB_DIR: ${{ github.workspace }}/site
          PORT: "9876"
        run: |
          python -m server >/tmp/lhci-server.log 2>&1 &
          sleep 3
      - name: Run Lighthouse CI
        uses: treosh/lighthouse-ci-action@v12
        with:
          urls: http://127.0.0.1:9876/
          configPath: ./lighthouserc.js
          uploadArtifacts: true
          temporaryPublicStorage: true

  zap-scan:
    name: "3 · OWASP ZAP baseline (rianell.com)"
    needs: [deploy-pages]
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@v5
      - name: ZAP full scan (retry on cold cache)
        uses: nick-fields/retry@v3
        with:
          timeout_minutes: 25
          max_attempts: 2
          command: |
            docker run --rm -v ${{ github.workspace }}:/zap/wrk:rw \
              -t ghcr.io/zaproxy/zaproxy:stable zap-full-scan.py \
              -t https://rianell.com/ -J /zap/wrk/zap-results.sarif -m 5 -I || true
      - name: Upload ZAP SARIF
        if: always() && hashFiles('zap-results.sarif') != ''
        uses: github/codeql-action/upload-sarif@v3
        continue-on-error: true
        with:
          sarif_file: zap-results.sarif
          category: owasp-zap

  audit-boot-post-deploy:
    name: "3 · Post-deploy boot audit (Pages site)"
    needs: [deploy-pages]
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master')
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: read
      actions: write
    steps:
      - uses: actions/checkout@v5

      - uses: ./.github/actions/setup-node-ci

      - uses: ./.github/actions/install-playwright-chromium

      - uses: ./.github/actions/setup-python-ci

      - name: Download deployed Pages site (same files as GitHub Pages)
        uses: actions/download-artifact@v5
        with:
          name: pages-site-probe
          path: site

      - name: Verify Pages site bundle
        run: |
          node -e "
          const fs = require('fs');
          const root = 'site';
          const m = JSON.parse(fs.readFileSync(root + '/asset-manifest.json', 'utf8'));
          if (!/^app\\.[a-f0-9]+\\.min\\.js$/.test(m.mainJs)) throw new Error('asset-manifest mainJs not fingerprinted');
          if (!fs.existsSync(root + '/' + m.mainJs)) throw new Error('missing ' + m.mainJs);
          console.log('Probe site matches deploy:', m.mainJs);
          "

      - name: Start probe server (Rianell HTTP — same site/ tree as GitHub Pages)
        env:
          RIANELL_WEB_DIR: ${{ github.workspace }}/site
          PORT: "9876"
          HOST: "127.0.0.1"
        run: |
          set -euo pipefail
          MAIN_JS=$(node -pe "JSON.parse(require('fs').readFileSync('site/asset-manifest.json','utf8')).mainJs")
          python -m server >/tmp/probe-server.log 2>&1 &
          for i in $(seq 1 20); do
            if curl -fsS "http://127.0.0.1:9876/${MAIN_JS}" -o /dev/null; then
              echo "Pages probe server ready (${MAIN_JS})"
              exit 0
            fi
            sleep 2
          done
          echo "Pages probe server failed to start" >&2
          tail -n 40 /tmp/probe-server.log || true
          exit 1

      - name: Boot audit (GitHub Pages site served locally)
        env:
          AUDIT_PROFILE: baseline
          PROBE_URL: http://127.0.0.1:9876/
          PROBE_PASS_MS: "120000"
          PROBE_WARM_PASS_MS: "100000"
          PROBE_GUEST_PASS_MS: "120000"
        run: npm run audit:boot:baseline

      - name: Enforce boot warm budget (progressive launch gate)
        env:
          BOOT_WARM_CI_MAX_MS: "120000"
        run: node scripts/audit/verify-boot-warm-budget.mjs audit-history/latest-boot-audit.json

      - name: Verify deploy HTML (local Pages probe only)
        env:
          PROBE_URL: http://127.0.0.1:9876/
        run: node scripts/audit/verify-deploy-html.mjs

      - name: Benchmark security audit (GitHub Pages site served locally)
        env:
          AUDIT_PROFILE: baseline
          PROBE_URL: http://127.0.0.1:9876/
        run: node scripts/audit/audit-benchmark-security.mjs

      - name: Cancel workflow on failure
        if: failure()
        uses: ./.github/actions/cancel-workflow-on-failure

  audit-llm-download-live:
    name: "3 · Live LLM download (rianell.com / Cloudflare)"
    needs: [deploy-pages]
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master')
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
      actions: write
    steps:
      - uses: actions/checkout@v5

      - uses: ./.github/actions/setup-node-ci

      - uses: ./.github/actions/install-playwright-chromium

      - uses: ./.github/actions/setup-python-ci

      - name: Wait for live deploy HTML
        env:
          VERIFY_URLS: https://rianell.com/
          VERIFY_ATTEMPTS: "12"
          VERIFY_DELAY_MS: "30000"
        run: node scripts/audit/verify-deploy-html.mjs

      - name: Live boot probe (Cloudflare)
        env:
          PROBE_URL: https://rianell.com/
          PROBE_PASS_MS: "120000"
          PROBE_GOTO_TIMEOUT_MS: "180000"
        run: node scripts/ci/deploy-probe-loop.mjs

      - name: Download deployed Pages site (LLM probe — bypass Cloudflare bot CSP)
        uses: actions/download-artifact@v5
        with:
          name: pages-site-probe
          path: site

      - name: Start probe server (same bundle as GitHub Pages)
        env:
          RIANELL_WEB_DIR: ${{ github.workspace }}/site
          PORT: "9876"
          HOST: "127.0.0.1"
        run: |
          set -euo pipefail
          MAIN_JS=$(node -pe "JSON.parse(require('fs').readFileSync('site/asset-manifest.json','utf8')).mainJs")
          python -m server >/tmp/llm-probe-server.log 2>&1 &
          for i in $(seq 1 20); do
            if curl -fsS "http://127.0.0.1:9876/${MAIN_JS}" -o /dev/null; then
              echo "LLM probe server ready (${MAIN_JS})"
              exit 0
            fi
            sleep 2
          done
          echo "LLM probe server failed to start" >&2
          tail -n 40 /tmp/llm-probe-server.log || true
          exit 1

      - name: Verify LLM vendor assets in Pages probe bundle
        run: |
          node -e "
          const fs = require('fs');
          const root = 'site';
          const wasm = root + '/vendor/transformers/ort-wasm-simd-threaded.jsep.wasm';
          const js = root + '/vendor/transformers/transformers.min.js';
          if (!fs.existsSync(wasm)) throw new Error('missing ' + wasm);
          if (fs.statSync(wasm).size < 1000000) throw new Error('wasm corrupt or LFS pointer');
          if (!fs.existsSync(js)) throw new Error('missing ' + js);
          console.log('LLM vendor OK:', wasm, fs.statSync(wasm).size, 'bytes');
          "

      - name: Live HF model download probe (Pages bundle, local)
        env:
          PROBE_URL: http://127.0.0.1:9876/
          PROBE_DOWNLOAD_TIMEOUT_MS: "1200000"
          PROBE_TIER: "1"
          PROBE_GPU_AVAILABLE: "0"
          PROBE_ATTEMPTS: "3"
          PROBE_ATTEMPT_DELAY_MS: "120000"
        run: node scripts/ci/probe-llm-download-live.mjs

  # ═══════════════════════════════════════════════════════════════════════════
  # Phase 4 — Bot commits, release, live checks
  # ═══════════════════════════════════════════════════════════════════════════
  commit-benchmarks:
    name: "4 · Commit benchmark reports"
    needs: [benchmarks-web, benchmarks-expo]
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master')
    runs-on: ubuntu-latest
    concurrency:
      group: ci-bot-push-${{ github.ref }}
      cancel-in-progress: false
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Sync branch with origin
        run: |
          git fetch origin "${{ github.ref_name }}"
          git checkout -B "${{ github.ref_name }}" "origin/${{ github.ref_name }}"

      - name: Download benchmark artifacts
        uses: actions/download-artifact@v5
        with:
          name: benchmarks-web
          path: bw

      - name: Download Expo benchmark artifact
        uses: actions/download-artifact@v5
        with:
          name: benchmarks-expo
          path: be

      - name: Merge reports and update index
        run: node benchmarks/scripts/merge-benchmark-ci.mjs bw be "${{ github.workspace }}"

      - name: Commit and push benchmarks
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add benchmarks/
          git diff --staged --quiet && { echo "No benchmark changes"; exit 0; }
          git commit -m "chore(benchmarks): update CI benchmark reports [skip ci]"
          git push origin "${{ github.ref_name }}"

  commit-app-build:
    name: "4 · Commit artifact manifests to repo"
    needs: [paths-filter, expo-bundle-prod, server-exe, rncli-android-apk, rncli-ios-zip]
    if: |
      (github.event_name == 'push' || github.event_name == 'workflow_dispatch') &&
      needs.paths-filter.outputs.mobile_release == 'true'
    runs-on: ubuntu-latest
    concurrency:
      group: ci-bot-push-${{ github.ref }}
      cancel-in-progress: false
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Sync branch with origin
        run: |
          git fetch origin "${{ github.ref_name }}"
          git checkout -B "${{ github.ref_name }}" "origin/${{ github.ref_name }}"

      - name: Download RN CLI Android APK
        uses: actions/download-artifact@v5
        with:
          name: rncli-android-dist
          path: artifacts/RNCLI-Android/

      - name: Download RN CLI iOS Xcode project zip
        uses: actions/download-artifact@v5
        with:
          name: rncli-ios-dist
          path: artifacts/iOS/

      - name: Download Server EXE artifacts
        uses: actions/download-artifact@v5
        with:
          pattern: server-exe-*
          path: gh-server

      - name: Merge Server manifest JSON only
        run: |
          mkdir -p "artifacts/Server"
          cp -f gh-server/server-exe-x64/latest-x64.json "artifacts/Server/" 2>/dev/null || true
          cp -f gh-server/server-exe-x86/latest-x86.json "artifacts/Server/" 2>/dev/null || true
          if [ -f gh-server/server-exe-x64/latest.json ]; then
            cp -f gh-server/server-exe-x64/latest.json "artifacts/Server/latest.json"
          else
            echo '{"version":${{ github.run_number }},"file":"rianell-server-x64.exe"}' > "artifacts/Server/latest.json"
          fi
          rm -f "artifacts/Server/"*.exe 2>/dev/null || true

      - name: Strip binaries from artifact dirs (manifest-only policy)
        run: |
          rm -f artifacts/RNCLI-Android/*.apk 2>/dev/null || true
          rm -f "artifacts/iOS/Health-Tracker-ios-alpha-build-"*.zip 2>/dev/null || true
          rm -f "artifacts/iOS/Health-Tracker-simulator-alpha-"*.zip 2>/dev/null || true
          rm -rf "artifacts/Expo/dist-expo-prod" 2>/dev/null || true

      - uses: ./.github/actions/setup-node-ci
        with:
          install: "false"
          cache-node-modules: "false"

      - name: Write README beta build info
        env:
          GITHUB_RUN_NUMBER: ${{ github.run_number }}
          GITHUB_SHA: ${{ github.sha }}
          GITHUB_RUN_ID: ${{ github.run_id }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: node scripts/ci/update-readme-build-info.mjs

      - name: Commit and push artifact manifests
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add README.md
          for f in \
            "artifacts/RNCLI-Android/latest.json" \
            "artifacts/iOS/latest.json" \
            "artifacts/iOS/Health-Tracker-ios-alpha-latest.zip" \
            "artifacts/Server/latest.json" \
            "artifacts/Server/latest-x64.json" \
            "artifacts/Server/latest-x86.json"; do
            if [ -f "$f" ]; then git add "$f"; fi
          done
          git diff --staged --quiet && { echo "No README/manifest changes"; exit 0; }
          git commit -m "docs(readme): update beta build info + artifact manifests (build ${{ github.run_number }}) [skip ci]"
          git push origin "${{ github.ref_name }}"

  publish-release:
    name: "4 · Publish GitHub Release"
    needs: [paths-filter, server-exe, rncli-android-apk]
    if: |
      (github.event_name == 'push' || github.event_name == 'workflow_dispatch') &&
      needs.paths-filter.outputs.mobile_release == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5

      - name: Download RN CLI Android APK artifact
        uses: actions/download-artifact@v5
        with:
          name: rncli-android-dist
          path: gh-release/RNCLI-Android/

      - name: Download Server EXE binaries
        uses: actions/download-artifact@v5
        with:
          pattern: server-exe-*
          path: gh-release/Server

      - name: Prepare release assets (APK + EXE only)
        run: |
          set -e
          RUN="${{ github.run_number }}"
          mkdir -p release-assets/RNCLI/Android release-assets/Server

          if [ -d "gh-release/RNCLI-Android" ]; then
            cp -v gh-release/RNCLI-Android/*.apk release-assets/RNCLI/Android/ 2>/dev/null || true
            cp -v gh-release/RNCLI-Android/latest.json release-assets/RNCLI/Android/ 2>/dev/null || true
          fi

          cp "gh-release/Server/server-exe-x64/rianell-server-x64.exe" "release-assets/Server/"
          cp "gh-release/Server/server-exe-x86/rianell-server-x86.exe" "release-assets/Server/"
          cp "gh-release/Server/server-exe-x64/latest-x64.json" "release-assets/Server/" || true
          cp "gh-release/Server/server-exe-x86/latest-x86.json" "release-assets/Server/" || true
          if [ -f "gh-release/Server/server-exe-x64/latest.json" ]; then
            cp "gh-release/Server/server-exe-x64/latest.json" "release-assets/Server/server-latest.json"
          fi
          echo "Release files:"
          find release-assets -type f | sort

      - name: Create GitHub Release with current build binaries
        uses: softprops/action-gh-release@v3
        with:
          tag_name: build-${{ github.run_number }}
          name: Rianell build ${{ github.run_number }}
          body: |
            ## Build info
            - Build: **${{ github.run_number }}**
            - Branch: `${{ github.ref_name }}`
            - Commit: `${{ github.sha }}`

            ## Assets (APK + Windows EXE only)

            ### Android APK
            Directory: `release-assets/RNCLI/Android/`

            ### Server (Windows EXE)
            Directory: `release-assets/Server/`
            - `rianell-server-x64.exe`
            - `rianell-server-x86.exe`

            ## Notes
            - Expo bundles and iOS zips stay in Actions artifacts (1-day retention) and are not attached to releases.
            - `artifacts/*/latest.json` manifests on the branch point at this release.
          draft: false
          prerelease: false
          fail_on_unmatched_files: true
          files: |
            release-assets/RNCLI/Android/*
            release-assets/Server/*.exe
            release-assets/Server/*.json
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  readme-build-info:
    name: "4 · Update README beta build info (web-only)"
    needs: [deploy-pages, paths-filter, audit-boot-post-deploy]
    if: |
      success() &&
      github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master') &&
      needs.paths-filter.outputs.mobile_release != 'true'
    runs-on: ubuntu-latest
    concurrency:
      group: ci-bot-push-${{ github.ref }}
      cancel-in-progress: false
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Sync branch with origin
        run: |
          git fetch origin "${{ github.ref_name }}"
          git checkout -B "${{ github.ref_name }}" "origin/${{ github.ref_name }}"

      - uses: ./.github/actions/setup-node-ci
        with:
          install: "false"
          cache-node-modules: "false"

      - name: Write README beta build info
        env:
          GITHUB_RUN_NUMBER: ${{ github.run_number }}
          GITHUB_SHA: ${{ github.sha }}
          GITHUB_RUN_ID: ${{ github.run_id }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: node scripts/ci/update-readme-build-info.mjs

      - name: Commit and push README
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add README.md
          git diff --staged --quiet && { echo "No README changes"; exit 0; }
          git commit -m "docs(readme): update beta build info [skip ci]"
          git push origin "${{ github.ref_name }}"

  security-headers-report:
    name: "4 · Security headers report (live site)"
    needs: [deploy-pages, audit-boot-post-deploy]
    if: |
      success() &&
      github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master')
    runs-on: ubuntu-latest
    concurrency:
      group: ci-bot-push-${{ github.ref }}
      cancel-in-progress: false
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Sync branch with origin
        run: |
          git fetch origin "${{ github.ref_name }}"
          git checkout -B "${{ github.ref_name }}" "origin/${{ github.ref_name }}"

      - uses: ./.github/actions/setup-node-ci
        with:
          install: "false"
          cache-node-modules: "false"

      - name: Generate Markdown security reports
        env:
          SECURITY_HEADERS_URL: https://securityheaders.com/?q=rianell.com&followRedirects=on
          SECURITY_HEADERS_FALLBACK_SITE: https://rianell.com
          SECURITY_HEADERS_LIVE_URLS: https://rianell.com;https://www.rianell.com
          OUT_LATEST: ${{ github.workspace }}/security/securityheaders-rianell.com.md
          OUT_RUN: ${{ github.workspace }}/security/securityheaders-runs/run-${{ github.run_number }}.md
          GITHUB_RUN_NUMBER: ${{ github.run_number }}
          GITHUB_SHA: ${{ github.sha }}
          GITHUB_RUN_ID: ${{ github.run_id }}
        run: node scripts/audit/fetch-securityheaders-report.mjs

      - name: Prune securityheaders-runs (keep last 10)
        run: node scripts/audit/fetch-securityheaders-report.mjs --prune-only

      - name: Commit and push security reports
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add security/securityheaders-rianell.com.md "security/securityheaders-runs/run-${{ github.run_number }}.md"
          git diff --staged --quiet && { echo "No security report changes"; exit 0; }
          git commit -m "chore(security): refresh securityheaders.com report [skip ci]"
          git push origin "${{ github.ref_name }}"
