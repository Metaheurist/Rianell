name: Setup Node.js (cached)
description: Node 24.14.1 with npm cache keyed on package-lock.json; optional npm ci.
inputs:
  install:
    description: Run npm ci when true
    required: false
    default: "true"
runs:
  using: composite
  steps:
    - name: Setup Node.js
      uses: actions/setup-node@v5
      with:
        node-version: "24.14.1"
        cache: npm
        cache-dependency-path: package-lock.json

    - name: Install root dependencies
      if: inputs.install == 'true'
      shell: bash
      run: npm ci
