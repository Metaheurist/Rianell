name: Install Playwright Chromium (cached)
description: Restore browser binaries from cache; full download only when lockfile/version changes.
runs:
  using: composite
  steps:
    - name: Restore Playwright browsers cache
      uses: actions/cache@v5
      id: playwright-cache
      with:
        path: ~/.cache/ms-playwright
        key: playwright-${{ runner.os }}-${{ hashFiles('package-lock.json') }}

    - name: Install Playwright Chromium (full)
      if: steps.playwright-cache.outputs.cache-hit != 'true'
      shell: bash
      run: npx playwright install chromium --with-deps

    - name: Link Playwright Chromium (cache hit)
      if: steps.playwright-cache.outputs.cache-hit == 'true'
      shell: bash
      run: npx playwright install chromium
