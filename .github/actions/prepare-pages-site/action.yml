name: Prepare GitHub Pages site
description: Copy minified prebuild to site/, verify fingerprinted bundle, inject Supabase config (deploy + audit parity).
inputs:
  minified-path:
    description: Root path of the minified-prebuild artifact download
    required: false
    default: ci-minified
  site-path:
    description: Output site directory (GitHub Pages root)
    required: false
    default: site
runs:
  using: composite
  steps:
    - name: Prepare site from minified temp artifact
      shell: bash
      run: |
        set -euo pipefail
        MINIFIED="${{ inputs.minified-path }}"
        SITE="${{ inputs.site-path }}"
        rm -rf "$SITE"
        cp -r "$MINIFIED/site" "$SITE"
        node -e "
        const fs = require('fs');
        const root = process.argv[1];
        const m = JSON.parse(fs.readFileSync(root + '/asset-manifest.json', 'utf8'));
        if (!/^app\\.[a-f0-9]+\\.min\\.js$/.test(m.mainJs)) throw new Error('asset-manifest mainJs not fingerprinted');
        if (!fs.existsSync(root + '/' + m.mainJs)) throw new Error('missing ' + m.mainJs);
        console.log('Pages site OK:', m.mainJs);
        " "$SITE"

    - name: Inject Supabase config for GitHub Pages
      shell: bash
      env:
        SUPABASE_URL: ${{ env.SUPABASE_URL }}
        SUPABASE_ANON_KEY: ${{ env.SUPABASE_ANON_KEY }}
        SITE_PATH: ${{ inputs.site-path }}
      run: |
        set -euo pipefail
        node -e "
        const fs = require('fs');
        const path = process.env.SITE_PATH + '/supabase-config.js';
        let c = fs.readFileSync(path, 'utf8');
        const url = process.env.SUPABASE_URL || '';
        const key = process.env.SUPABASE_ANON_KEY || '';
        c = c.replace(/url:\s*['\"][^'\"]*['\"]/, 'url: ' + JSON.stringify(url || 'https://YOUR_PROJECT_REF.supabase.co'));
        c = c.replace(/anonKey:\s*['\"][^'\"]*['\"]/, 'anonKey: ' + JSON.stringify(key || 'YOUR_SUPABASE_ANON_KEY'));
        fs.writeFileSync(path, c);
        "

    - name: Inject Smartlook project key for GitHub Pages
      shell: bash
      env:
        SMARTLOOK_PROJECT_KEY: ${{ env.SMARTLOOK_PROJECT_KEY }}
        SITE_PATH: ${{ inputs.site-path }}
      run: |
        set -euo pipefail
        node -e "
        const fs = require('fs');
        const path = process.env.SITE_PATH + '/smartlook-config.js';
        if (!fs.existsSync(path)) {
          console.log('smartlook-config.js missing — skipping Smartlook inject');
          process.exit(0);
        }
        let c = fs.readFileSync(path, 'utf8');
        const key = process.env.SMARTLOOK_PROJECT_KEY || '';
        if (key) {
          c = c.replace(/projectKey:\s*['\"][^'\"]*['\"]/, 'projectKey: ' + JSON.stringify(key));
        }
        fs.writeFileSync(path, c);
        "

    - name: Inject Web Push VAPID public key for GitHub Pages
      shell: bash
      env:
        VAPID_PUBLIC_KEY: ${{ env.VAPID_PUBLIC_KEY }}
        SITE_PATH: ${{ inputs.site-path }}
      run: |
        set -euo pipefail
        node -e "
        const fs = require('fs');
        const path = process.env.SITE_PATH + '/push-config.js';
        if (!fs.existsSync(path)) {
          console.log('push-config.js missing — skipping VAPID inject');
          process.exit(0);
        }
        let c = fs.readFileSync(path, 'utf8');
        const key = process.env.VAPID_PUBLIC_KEY || '';
        c = c.replace(/vapidPublicKey:\s*['\"][^'\"]*['\"]/, 'vapidPublicKey: ' + JSON.stringify(key || 'YOUR_VAPID_PUBLIC_KEY'));
        fs.writeFileSync(path, c);
        "
