name: Setup Python (cached pip)
description: Python with pip cache keyed on requirements.txt (+ optional extras file).
inputs:
  python-version:
    description: Python version
    required: false
    default: "3.11"
  install-requirements:
    description: pip install -r requirements.txt
    required: false
    default: "true"
  install-extras:
    description: pip install packages from .github/ci-pip-extras.txt
    required: false
    default: "false"
runs:
  using: composite
  steps:
    - name: Setup Python
      uses: actions/setup-python@v6
      with:
        python-version: ${{ inputs.python-version }}
        cache: pip
        cache-dependency-path: |
          requirements.txt
          .github/ci-pip-extras.txt

    - name: Install Python dependencies
      shell: bash
      run: |
        python -m pip install --upgrade pip
        if [ "${{ inputs.install-requirements }}" = "true" ]; then
          python -m pip install -r requirements.txt
        fi
        if [ "${{ inputs.install-extras }}" = "true" ] && [ -f .github/ci-pip-extras.txt ]; then
          python -m pip install -r .github/ci-pip-extras.txt
        fi
