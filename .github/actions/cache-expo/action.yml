name: Cache Expo and Metro
description: Restore ~/.expo and apps/rn-app/.expo keyed on lockfiles.
runs:
  using: composite
  steps:
    - name: Restore Expo / Metro cache
      uses: actions/cache@v4
      with:
        path: |
          ~/.expo
          apps/rn-app/.expo
        key: expo-${{ runner.os }}-${{ hashFiles('package-lock.json', 'apps/rn-app/package.json') }}
        restore-keys: |
          expo-${{ runner.os }}-
