version: 2
updates:
  - package-ecosystem: npm
    directory: "/"
    schedule:
      interval: weekly
      day: monday
    groups:
      patch-updates:
        update-types: ["patch"]
    ignore:
      - dependency-name: "@huggingface/transformers"
        versions: [">=3.3.3"]
  - package-ecosystem: pip
    directory: "/server"
    schedule:
      interval: weekly
