version: 2
updates:
  - package-ecosystem: npm
    directory: "/"
    schedule:
      interval: weekly
      day: monday
    groups:
      patch-updates:
        update-types: ["patch"]
    ignore:
      - dependency-name: "@huggingface/transformers"
        versions: [">=3.3.3"]
      - dependency-name: "jest"
        versions: [">=30.0.0"]
      - dependency-name: "@react-native/babel-preset"
        versions: [">=0.84.0"]
      - dependency-name: "expo-modules-core"
        versions: [">=56.0.0"]
  - package-ecosystem: pip
    directory: "/server"
    schedule:
      interval: weekly
