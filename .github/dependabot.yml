version: 2
updates:
  - package-ecosystem: npm
    directory: "/"
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 10
    target-branch: main
    groups:
      rianell-workspace:
        patterns:
          - "@rianell/*"
      dev-tooling:
        dependency-type: development
        patterns:
          - "*"
    labels:
      - dependencies
      - npm

  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    target-branch: main
    labels:
      - dependencies
      - github-actions
