version: 2
updates:
  - package-ecosystem: npm
    directory: "/"
    schedule:
      interval: weekly
      day: monday
    groups:
      patch-updates:
        update-types: ["patch"]
    ignore:
      # Keep transformers on the pinned matrix.
      - dependency-name: "@huggingface/transformers"
        versions: [">=3.3.3"]
      - dependency-name: "jest"
        versions: [">=30.0.0"]
      # Babel 8 is a separate toolchain upgrade.
      - dependency-name: "@babel/core"
        versions: [">=8.0.0"]
      - dependency-name: "@babel/traverse"
        versions: [">=8.0.0"]
      - dependency-name: "@babel/*"
        versions: [">=8.0.0"]
      # TypeScript 6+/7 is a separate toolchain upgrade.
      - dependency-name: "typescript"
        versions: [">=6.0.0"]
  - package-ecosystem: pip
    # Python server deps live at repo root (requirements.txt), not under server/
    directory: "/"
    schedule:
      interval: weekly
    ignore:
      # supabase realtime 2.31.x still requires websockets<16
      - dependency-name: "websockets"
        versions: [">=16.0.0"]
